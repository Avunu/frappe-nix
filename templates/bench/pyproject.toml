[project]
# Usually the bench name; suffixed with -bench when an app under apps/ has the
# same name, since uv refuses a workspace root that collides with a member.
name = "@PROJECT_NAME@"
version = "0.1.0"
description = "Frappe bench workspace managed by frappe-nix"
requires-python = "@REQUIRES_PYTHON@"
readme = "README.md"

# frappe-bench provides the `bench` CLI; setuptools is kept in the venv because
# several transitive deps import pkg_resources at runtime. It is left
# unconstrained so apps that pin an exact setuptools (e.g. payments) win instead
# of conflicting with a floor here.
#
# frappe-runtime is the process that serves the bench under frappe-nix.runtime
# (web + realtime + jobs + scheduler in one). It has to be a real workspace
# dependency because uv2nix indexes its package set by uv.lock; which *source*
# is built comes from frappe-nix itself (see [tool.uv.sources] below).
dependencies = [
    "frappe-bench>=5.29.0",
    "frappe-runtime",
    "setuptools",
]

# Dev-only tools — in the devenv shell, excluded from production containers.
[dependency-groups]
dev = [
    "coverage>=7.10",
    "pre-commit>=4.5.1",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "responses",
    "ruff>=0.15.0",
    "semgrep",
    "unittest-xml-reporting>=3.2",
]

[tool.uv]
# uv workspace over all apps; this root is a virtual package (no wheel built).
package = false
# Resolve conflicts between frappe-bench (the CLI) and frappe. Seeded from the
# frappe-nix preset; add entries here if `uv lock` reports an unsatisfiable
# requirement, then re-run `uv lock`.
override-dependencies = "@OVERRIDES@"

# Build dependencies for the packages uv.lock has no wheel for, which uv2nix
# builds from their sdist in the sandbox: setuptools for each (an old sdist often
# declares no backend), plus frappe-nix's own entries (frappe-runtime's
# hatchling, cairocffi's cffi). Derived from uv.lock by `frappe-nix-build-deps
# update`, which every relock runs; the lines between the two markers are
# rewritten, so add a bench's own entries with the
# frappe-nix.pythonBuildDependencies option, not here.
[tool.uv.extra-build-dependencies]
# >>> frappe-nix: sdist build deps (managed) >>>
"cairocffi" = ["setuptools", "cffi", "pycparser"]
"frappe-runtime" = ["hatchling"]
# <<< frappe-nix: sdist build deps (managed) <<<

# Managed by frappe-nix: `frappe-init`, `bench-get-app` and `bench-new-app` all
# register apps here through `frappe-nix-workspace`. Members are paths; source
# keys are the app's own [project].name, which is what uv resolves it to.
[tool.uv.workspace]
members = []

[tool.uv.sources]
# A placeholder for uv's resolver, not a version pin: frappe-nix overrides the
# source it builds with its own runtime/ directory (frappe-nix.runtime.src), so a
# frappe-runtime bump is `nix flake update frappe-nix`, never an edit here. A
# plain `uv lock` keeps an already-resolved git revision; if frappe-runtime ever
# adds a dependency, `nix run .#relock -- --upgrade-package frappe-runtime`.
frappe-runtime = { git = "https://github.com/Avunu/frappe-nix", subdirectory = "runtime" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Virtual package — workspace root only.
skip-excluded-dirs = true

[tool.ruff]
line-length = 110
target-version = "@PYTAG@"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "@PYVER@"
ignore_missing_imports = true
