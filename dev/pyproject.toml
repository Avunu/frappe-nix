# frappe-nix's own development environment: the pinned upstream Frappe that
# the editor and ty resolve against, plus the editor's ruff. The commit hooks do
# not run from here: prek installs its own, from .pre-commit-config.yaml.
#
# Not a bench and not shipped: nothing outside dev/ reads this file. It lives
# here rather than at the repository root so that a consumer resolving
# `git+https://github.com/Avunu/frappe-nix#subdirectory=runtime` never finds a
# uv workspace above runtime/.
#
# Built by frappe-nix's own lib/python.nix (see dev/env.nix), so a stale
# uv.lock is reported by the lock audit (lib/python.nix) exactly as it is in a bench.
#
# Bump Frappe with `update-frappe`; the ruff pin, the ruff-pre-commit rev in
# .pre-commit-config.yaml and dev/frappe-ruff.toml follow it
# (dev/frappe-upstream.py), and the frappe-upstream-config check fails when any
# of them drifts.
[project]
name = "frappe-nix-dev"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "frappe",
    "frappe-runtime",
]

[dependency-groups]
dev = [
    # py/frappe_nix_tools's prompts and output (rich, from nixpkgs there), so ty resolves them.
    "rich",
    "ruff==0.14.10",
    # py/frappe_nix_tools's one dependency frappe does not bring (jinja2, packaging and
    # pyyaml it does), so ty resolves the managed-file engine's imports.
    "tomlkit>=0.13",
    "ty",
]

[tool.uv]
package = false
# The version-16 row of lib/frappe-presets.json. The last entry drops
# pypika-stubs: from 16.51 frappe pins its PyPika fork at 0.51.1 (which ships
# py.typed) while its `dev` extra still lists the stubs, and every stubs release
# pins pypika<0.49. A marker that never holds under requires-python >=3.14
# removes the requirement; develop already dropped the stubs (frappe#42788).
override-dependencies = [
	"click~=8.3.1",
	"requests>=2.34.2",
	"google-api-python-client~=2.188.0",
	"pypika-stubs; python_full_version < '3.14'",
]

[tool.uv.sources]
# An archive of one commit, not a git source: uv2nix fetches git sources with a
# full, non-shallow fetchGit, i.e. Frappe's entire history on every cold
# evaluation (CI included). `update-frappe` rewrites this URL to the tip of the
# branch below.
frappe = { url = "https://github.com/frappe/frappe/archive/f20f92d29706510551b4438cc196b0323a7f1a92.tar.gz" }
frappe-runtime = { path = "../runtime", editable = true }

[tool.frappe-nix]
# The Frappe branch `update-frappe` follows: a lib/frappe-presets.json row.
frappe-branch = "version-16"

# Build dependencies for the packages dev/uv.lock has no wheel for, which uv2nix
# builds from their sdist: setuptools for each, plus the entries the lock cannot
# show (lib/build-deps.nix, `dev`): Frappe is a URL source whose backend is
# flit-core, and frappe-runtime is installed editable, which hatchling builds
# through `editables`. Derived by `frappe-nix-build-deps update`, which
# update-frappe and sync-frappe-upstream run after `uv lock`; the
# `build-deps` check fails when it is out of date.
[tool.uv.extra-build-dependencies]
# >>> frappe-nix: sdist build deps (managed) >>>
"cairocffi" = ["setuptools", "cffi", "pycparser"]
"docopt" = ["setuptools"]
"frappe" = ["flit-core"]
"frappe-runtime" = ["hatchling", "editables"]
"gunicorn" = ["setuptools"]
"mysqlclient" = ["setuptools"]
"pypika" = ["setuptools"]
"pyqrcode" = ["setuptools"]
"rauth" = ["setuptools"]
# <<< frappe-nix: sdist build deps (managed) <<<
