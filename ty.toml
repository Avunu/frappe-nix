[environment]
# The dev shell links the dev/uv.lock virtualenv here, as a bench does.
python = "./env"
# The oldest interpreter this code runs under (see ruff.toml).
python-version = "3.11"
# The working tree's packages. They reach the dev env through PYTHONPATH and an
# editable .pth that runs code at startup, which a static checker does not do.
# Keep in step with sourceRoots in dev/env.nix. The files python-devops-nix
# supplies to them (lib/grafts.nix's `vendored`) are copied in by the dev
# shell and by the ty check.
extra-paths = [
    "runtime/src",
    "lib/devguard",
    "lib/unixsock",
    "lib/journald",
    "lib/nodebuild",
    "py/frappe_nix_tools",
]

[src]
# lib/tui and its test run on the menu's own interpreter (textual, and
# python-devops-nix's devtui), which the dev env does not have; tests/tui.nix
# runs them there.
exclude = ["tests/fixtures", "lib/tui", "tests/test_tui.py"]

# The suites stand Frappe, bench, botocore and socketio up as hand-built stub
# modules and fakes, so the shapes ty infers for those are the stubs', not the
# real thing's. Imports, names and syntax are still checked.
[[overrides]]
include = ["**/tests/**", "tests/**"]

[overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-attribute-access = "ignore"
