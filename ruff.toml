# Frappe's ruff config, tracked: dev/frappe-ruff.toml is the [tool.ruff] of the
# Frappe revision dev/uv.lock pins, regenerated by `sync-frappe-upstream` and
# checked by the frappe-upstream-config flake check. Only frappe-nix's own
# departures belong here.
extend = "dev/frappe-ruff.toml"

# Upstream targets its own interpreter (py314 on version-16). The code here also
# runs inside version-15 benches (python 3.12) and declares runtime/'s floor as
# 3.11, so pyupgrade fixes must not reach past that.
target-version = "py311"

# Stand-ins for third-party apps and benches, which stay byte for byte; and the
# scaffolding templates, whose pyproject.toml is not TOML until frappe-init
# substitutes its @PLACEHOLDERS@ (ruff would read it as nested config).
extend-exclude = ["tests/fixtures", "templates"]
