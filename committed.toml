# frappe-nix's own commit rules, checked by `committed` in the pr-policy workflow
# (.github/workflows/pr-policy.yml, docs/app-standards/versioning.md). Conventional commits:
# `fix:` → patch, `feat:` → minor. frappe-nix's pr-policy refuses `!` and BREAKING CHANGE;
# a major release is a deliberate `Release-As: <N>.0.0` footer (docs/app-standards/spec.md §6.3).
style = "conventional"
allowed_types = [
	"build",
	"chore",
	"ci",
	"docs",
	"feat",
	"fix",
	"perf",
	"refactor",
	"revert",
	"style",
	"test",
	"deprecate",
]
# A scope is optional; when there is one it names a part of the product. One list for
# frappe-nix and odoo-nix (python-devops-nix CONVENTIONS.md, Commits): every scope either
# repository has used, so a scope the other one coins is not refused here. `deps` is
# Dependabot's and `main` is release-please's (`chore(main): release X.Y.Z`). committed
# compares the text between the parentheses whole, so a commit that names two areas
# (`fix(nixos,runtime): ...`) needs that pair listed as written.
allowed_scopes = [
	"addons",
	"app-mode",
	"app-standards",
	"app-tools",
	"apps",
	"apps-report",
	"assets",
	"backup-fetch",
	"backups",
	"banner",
	"bench",
	"bench-get-app",
	"bench-update",
	"build",
	"ci",
	"cli",
	"containers",
	"deps",
	"dev",
	"dev_mailcatch",
	"devenv",
	"devguard",
	"docs",
	"flake",
	"frappe-test",
	"gate",
	"init",
	"journald",
	"lock",
	"mailpit",
	"main",
	"migrate",
	"module",
	"nixos",
	"nixos,runtime",
	"node",
	"node-locks",
	"node-verify",
	"oca_sources",
	"odoo-ls",
	"overrides",
	"policy",
	"ports",
	"presets",
	"provision",
	"python",
	"ratchet",
	"release",
	"relock",
	"restore",
	"runtime",
	"scaffold",
	"scripts",
	"secrets",
	"shell",
	"standards",
	"submodules",
	"sync",
	"tests",
	"tooling",
	"update",
]
subject_length = 100
line_length = 0
subject_capitalized = false
subject_not_punctuated = true
imperative_subject = false
no_wip = true
no_fixup = true
merge_commit = false
