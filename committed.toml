# frappe-nix's own commit rules, checked by `committed` in the pr-policy workflow
# (.github/workflows/pr-policy.yml, docs/app-standards/versioning.md). Conventional commits:
# `fix:` → patch, `feat:` → minor. frappe-nix's pr-policy refuses `!` and BREAKING CHANGE;
# a major release is a deliberate `Release-As: <N>.0.0` footer (docs/app-standards/spec.md §6.3).
style = "conventional"
allowed_types = [
	"build",
	"chore",
	"ci",
	"docs",
	"feat",
	"fix",
	"perf",
	"refactor",
	"revert",
	"style",
	"test",
	"deprecate",
]
subject_length = 100
line_length = 0
subject_capitalized = false
subject_not_punctuated = true
imperative_subject = false
no_wip = true
no_fixup = true
merge_commit = false
