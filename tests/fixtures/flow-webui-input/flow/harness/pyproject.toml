[project]
name = "frappe-flow"
version = "0.1.0"
requires-python = ">=3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_harness"]
artifacts = ["src/flow_harness/server/webui/**"]
