[project]
name = "esign"
authors = [{ name = "Example Org", email = "apps@example.org" }]
description = "Collect Electronic Signatures on Frappe Documents via Webforms"
requires-python = ">=3.14"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
include = ["esign/public/dist/*"]
