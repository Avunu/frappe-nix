[project]
name = "standards_fixture"
authors = [{ name = "Example Org", email = "apps@example.org" }]
description = "The app frappe-nix's app standards self-tests sync, test and check"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]

[tool.frappe-nix]
schema = 1
profile = "recommended"
frappe-major = 16
siblings = []

[[tool.frappe-nix.untested]]
target = "standards_fixture.api.legacy"
reason = "Deliberately untested: the testmap exemption the self-tests exercise"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "SIM", "C4", "PIE", "PERF", "T20"]
ignore = ["E501", "W191"]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["standards_fixture"]

[tool.ty.terminal]
error-on-warning = false

[tool.coverage.run]
omit = ["*/tests/*", "*/test_*.py", "*/patches/*"]
