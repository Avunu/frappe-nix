# frappe-nix:managed — generated by frappe-nix (`frappe-init --sync`); do not edit.
# Dependency PRs (docs: ci.md): relock and sync after a flake bump, auto-merge by the
# decision table, and the sweep that re-dispatches CI for bot PRs (§4.5).
name: deps
on:
  pull_request:
  schedule:
    # Re-dispatch CI for bot PRs.
    - cron: "0 9 * * *"
    # The weekly Python relock; passed as relock-cron below.
    - cron: "0 8 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  # The pull_request run: no secret at all. A Dependabot run sees only Dependabot secrets, and this
  # reusable runs the PR's own code. Its relock is pushed by deps-apply.yml, from the default branch.
  deps:
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    uses: Avunu/frappe-nix/.github/workflows/app-deps.yml@e97d588cf5805dfb382b210379fafa0223013285 # v2.6.1
    with:
      app: standards_fixture
      integration-branch: develop
      nix-cache: ${{ vars.FRAPPE_NIX_CACHE || '' }}
      auto-merge: true
      merge-method: squash
      relock-cron: "0 8 * * 1"
  # Pushes, schedules and dispatches: update-branches, the sweep and relock-upgrade. They hold the
  # cache and App secrets, which no pull_request run gets.
  deps-trusted:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    uses: Avunu/frappe-nix/.github/workflows/app-deps.yml@e97d588cf5805dfb382b210379fafa0223013285 # v2.6.1
    with:
      app: standards_fixture
      integration-branch: develop
      nix-cache: ${{ vars.FRAPPE_NIX_CACHE || '' }}
      auto-merge: true
      merge-method: squash
      relock-cron: "0 8 * * 1"
    secrets:
      NIX_CACHE_TOKEN: ${{ secrets.FRAPPE_NIX_CACHE_TOKEN }}
      NIX_CACHE_READ_TOKEN: ${{ secrets.FRAPPE_NIX_CACHE_READ_TOKEN }}
      FETCH_TOKEN: ${{ secrets.FRAPPE_NIX_FETCH_TOKEN }}
