# frappe-nix:managed — generated by frappe-nix (`frappe-init --sync`); edit only inside the frappe-nix:local region.
# Every entry targets develop. Bumps that change what the app runs commit as fix(deps) and ship as patch
# releases: nix, github-actions, pre-commit, gitsubmodule and the npm entries' dependencies. On the npm entries,
# prefix-development chore(deps) sends their devDependencies (Dependabot's Development dependency group) to chore(deps),
# which ships nothing. Those two entries write their prefixes whole, without include: scope. uv /tools and npm /docs-site
# commit as chore(deps)/chore(deps-dev).
# deps.yml decides what merges automatically.
version: 2
updates:
  # One entry for /, which is also the entry a docs tool scaffolds. Separate groups,
  # so a docs or pilot bump never holds up the rest.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope
    labels: [dependencies]
    # frappe-nix pins move through the frappe-nix release rollout (`frappe-nix repo rollout`), not Dependabot.
    # Dependabot names a reusable workflow by its path, hence the /* entry.
    ignore:
      - dependency-name: Avunu/frappe-nix
      - dependency-name: Avunu/frappe-nix/*
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps)
    labels: [dependencies]
    groups:
      toolchain:
        patterns: [oxlint, oxfmt, typescript, frappe-types, "@types/node", "stylelint*"]
        update-types: [minor, patch]
      runtime:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /tools
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    groups:
      tools:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pre-commit
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope
    labels: [dependencies]
    groups:
      hooks:
        patterns: ["*"]
  - package-ecosystem: nix
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      include: scope
    labels: [dependencies]
    # frappe-nix and the org profile move only through `frappe-nix repo rollout` (S5, S38): their bump can rewrite
    # workflow files, which GITHUB_TOKEN can't push. Dependabot moves frappe and the siblings, which never touch one.
    ignore:
      - dependency-name: frappe-nix
    groups:
      flake-inputs:
        patterns: ["*"]
  # frappe-nix:local-begin updates
  # frappe-nix:local-end updates
