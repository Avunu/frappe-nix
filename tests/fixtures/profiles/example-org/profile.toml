# A fictitious organisation's profile, for frappe-nix's own tests (docs/app-standards/spec.md §7):
# every module the managed files need on, Example Org's values, a [[retire]] rule, an
# [[extra-files]] entry and a README block override (templates/readme/support.md.j2). Not a
# real organisation's choices.
schema = 1
name = "example-org"
description = "Example Org's app standards: a test fixture with every module on."
extends = "recommended@1.0"

[org]
publisher = "Example Org"
email = "apps@example.org"
license = "MIT"
github-owner = "example-org"
website-url = "https://example.org/apps/{app}/"
docs-url = "https://{app_hyphen}.docs.example.org/"
support-url = "https://example.org/support/"

[org.brand]
tile-color = "#336699"

[ssort]
enable = true

[python-types]
error-on-warning = true

[typescript]
check-js = true

[commits]
allow-stacked = false

[releases]
version-scheme = "frappe-major"

[dependabot]
cadence = "daily"

[repo-policy]
enable = true
required-approvals = 0

[pilot-assets]
enable = true

[listing]
enable = true
registry-fork = "example-org/marketplace"

[readme]
enable = true

[icons]
enable = true

[screenshots]
enable = true

[demo]
enable = true
company-name = "Example Demo"
company-abbr = "ED"

[test-utils]
enable = true

[docs-site]
enable = true
action-patterns = ["example-org/docs-tool*"]
cooldown-exclude-actions = ["example-org/docs-tool"]
package-names = ["@example-org/docs-tool"]

[[retire]]
paths = [".github/workflows/check.yml"]
module = "ci"

[[extra-files]]
path = "SECURITY.md"
template = "SECURITY.md.j2"
strategy = "whole"
module = "hygiene"
header = "none"
