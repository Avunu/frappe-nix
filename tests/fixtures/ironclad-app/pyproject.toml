[project]
name = "ironclad_fixture"
authors = [{ name = "Avunu LLC", email = "mail@avu.nu" }]
description = "The app frappe-nix's Ironclad self-tests sync, test and check"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.coverage.report]
fail_under = 80

[tool.ironclad]
schema = 1
frappe-major = 16
siblings = []

[[tool.ironclad.untested]]
target = "ironclad_fixture.api.legacy"
reason = "Deliberately untested: the testmap exemption the self-tests exercise"
