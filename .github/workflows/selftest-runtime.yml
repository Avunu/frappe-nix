name: selftest-runtime

# N1's self-test (docs/ironclad/spec.md §7, "N1: runtime"): frappe-test, CI
# mode, the worktree ports and frappe-rename-app, run for real against the
# fixture app (tests/fixtures/ironclad-app) locked to this checkout. The Nix-only
# halves of the same tests are flake checks (tests/ironclad/runtime.nix and
# rename.nix, in check.yml's ironclad-all). Each job is
# tests/ironclad/selftest-runtime/run.sh, which runs the same way by hand.
#
#   main      frappe-test --ci passes; its variants exit 2, 3 and 7; two
#             worktrees run at once on different ports; FRAPPE_NIX_PORT_OFFSET;
#             the fixture renamed to ironclad_fixture2 on its own site
#   erpnext   the default test setup with erpnext as a sibling, and the A.0 #4
#             composition failure (exit 4)

on:
  pull_request:
    paths:
      - .github/workflows/selftest-runtime.yml
      - flake.lock
      - lib/ci-mode.nix
      - lib/frappe-workspace.py
      - lib/ports.nix
      - lib/rename/**
      - lib/scripts.d/**
      - lib/scripts.nix
      - lib/sh/frappe-test.sh
      - modules/devenv.nix
      - py/ironclad/**
      - templates/bench/pyproject.toml
      - tests/fixtures/ironclad-app/**
      - tests/ironclad/selftest-runtime/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selftest-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - name: Evaluate each Ironclad check
        run: |
          nix --version
          ulimit -a
          nix eval --raw .#devShells.x86_64-linux.default.drvPath > /dev/null
          for c in $(nix eval --json .#checks.x86_64-linux --apply 'c: builtins.filter (n: builtins.substring 0 9 n == "ironclad-") (builtins.attrNames c)' | jq -r '.[]'); do
            echo "== $c"
            nix eval --no-eval-cache --raw ".#checks.x86_64-linux.$c.drvPath" --show-trace 2>&1 | tail -n 30 || true
            echo
          done

  runtime:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [main, erpnext]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A Frappe bench (and erpnext's) is more than the hosted runner's free disk.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          diagnostic-endpoint: ""
          use-flakehub: false

      - name: Run ${{ matrix.suite }}
        env:
          SUITE: ${{ matrix.suite }}
        run: tests/ironclad/selftest-runtime/run.sh "$SUITE"

      - name: Reports and bench logs
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/ironclad-n1/*.log "$RUNNER_TEMP"/ironclad-n1/*/.frappe-nix/bench/logs/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            tail -n 200 "$f"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest-runtime-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/ironclad-n1/*.log
            ${{ runner.temp }}/ironclad-n1/*/.dev-dist/test/
          if-no-files-found: ignore
          include-hidden-files: true
