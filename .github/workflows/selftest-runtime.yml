name: selftest-runtime

# N1's self-test (docs/app-standards/spec.md §7, "N1: runtime"): frappe-test, CI
# mode, the worktree ports and frappe-rename-app, run for real against the
# fixture app (tests/fixtures/standards-app) locked to this checkout. The Nix-only
# halves of the same tests are flake checks (tests/standards/runtime.nix and
# rename.nix, in check.yml's standards-all). Each job is
# tests/standards/selftest-runtime/run.sh, which runs the same way by hand.
#
#   main      frappe-test --ci passes; its variants exit 2, 3 and 7; two
#             worktrees run at once on different ports; FRAPPE_NIX_PORT_OFFSET;
#             a held port leased past, or refused with FRAPPE_NIX_STRICT_PORTS=1;
#             the fixture renamed to standards_fixture2 on its own site
#   erpnext   the default test setup with erpnext as a sibling, and the A.0 #4
#             composition failure (exit 4)
#   parallel  two copies of the fixture under one name, tested at once: each
#             leases its own ports and answers as itself; a port held outside
#             frappe-nix is moved past. Beside the other legs, which run benches
#             of the same name on the same host, it is also the test that
#             leases hold across runner instances.

# Whatever builds the bench, the dev shell or the tools frappe-test calls: any
# change under lib/ or modules/, and the pins. Also on main and weekly, so a
# change that slips past the paths (or a moved input) still shows up.
on:
  pull_request:
    paths:
      - .github/workflows/selftest-runtime.yml
      - dev/pyproject.toml
      - flake.lock
      - flake.nix
      - lib/**
      - modules/**
      - py/frappe_nix_tools/**
      - templates/bench/**
      - tests/fixtures/standards-app/**
      - tests/standards/selftest-runtime/**
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR replaces its run; main's pushes and the weekly run
# always finish, each in a group of its own.
concurrency:
  group: selftest-runtime-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime:
    name: ${{ matrix.suite }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [main, erpnext, parallel]
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # run.sh dates the PyPI resolution by the last change to the pins.
          fetch-depth: 0

      # A Frappe bench (and erpnext's) is more than the hosted runner's free disk.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        if: runner.environment == 'github-hosted'
        with:
          diagnostic-endpoint: ""
          use-flakehub: false

      - name: Run ${{ matrix.suite }}
        env:
          SUITE: ${{ matrix.suite }}
        run: tests/standards/selftest-runtime/run.sh "$SUITE"

      # Which ports each bench still up leased, and who holds them.
      - name: Leased ports
        if: failure()
        run: tests/standards/selftest-runtime/run.sh collect-ports

      - name: Reports and bench logs
        if: always()
        run: |
          # process-compose.log: every process's output, and why one was Skipped.
          for f in "$RUNNER_TEMP"/standards-n1/*.log "$RUNNER_TEMP"/standards-n1/*/.frappe-nix/bench/logs/*.log \
            "$RUNNER_TEMP"/standards-n1/*/.devenv/state/process-compose/process-compose.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            tail -n 200 "$f"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: selftest-runtime-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/standards-n1/*.log
            ${{ runner.temp }}/standards-n1/*/.dev-dist/test/
            ${{ runner.temp }}/standards-n1/ports/
            ${{ runner.temp }}/standards-n1/*/.devenv/state/process-compose/process-compose.log
          if-no-files-found: ignore
          include-hidden-files: true
