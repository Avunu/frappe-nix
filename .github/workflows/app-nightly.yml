name: app-nightly

# Nightly (docs/app-standards/ci.md, spec §4.6), reusable. Never a required check, so each
# optional job is a `run-*` input the caller renders from its module switch: the integration
# suites (tests), screenshots (screenshots), the listing links (listing), code duplication
# (test-utils) and the registry refresh (listing.publish). `drift` always runs: it keeps the
# "frappe-nix vX.Y.Z available" and "standards profile update available" issues. `shots` runs
# frappe-shots with no write token and uploads the screenshot patch; `shots-push`, on
# ubuntu-latest whatever `runs-on` says and running no app code, checks that patch and that the
# integration branch holds the commit it was made on, and pushes it and opens its PR. With a GitHub App (APP_ID and APP_PRIVATE_KEY, ci.github-app) it does so
# with the App's token, which starts CI by itself; without one, GITHUB_TOKEN, and CI is
# dispatched. `auto-merge` (dependabot.auto-merge-policy = "all") enables auto-merge on that PR.

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      integration-branch:
        type: string
        default: develop
      nix-cache:
        description: '"", "cachix:<name>" or "attic:<endpoint>/<cache>"'
        type: string
        default: ""
      publish:
        type: boolean
        default: false
      run-integration:
        type: boolean
        default: true
      run-shots:
        type: boolean
        default: false
      run-links:
        type: boolean
        default: false
      run-duplication:
        type: boolean
        default: false
      auto-merge:
        description: 'auto-merge the screenshots PR (dependabot.auto-merge-policy = "all")'
        type: boolean
        default: false
      merge-method:
        description: the first of repo-policy.merge-methods
        type: string
        default: squash
      frappe-nix-override:
        description: frappe-nix's self-test only (a path in the workspace)
        type: string
        default: ""
      runs-on:
        description: >-
          The runner of every Linux job but shots-push, which holds the write token and always
          runs on ubuntu-latest, as JSON: a label or a list of labels (`["self-hosted", "nixos"]`).
          A pull request from a fork always runs on ubuntu-latest.
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      NIX_CACHE_TOKEN:
        required: false
      NIX_CACHE_READ_TOKEN:
        required: false
      FETCH_TOKEN:
        required: false
      REGISTRY_TOKEN:
        required: false
      APP_ID:
        description: "ci.github-app: the GitHub App's ID (or client ID); passed only with screenshots on"
        required: false
      APP_PRIVATE_KEY:
        description: "ci.github-app: the GitHub App's private key (PEM)"
        required: false

permissions: {}

env:
  FORCE_COLOR: "1"
  # The tools/ project's Python: uv would take its newest, which semgrep 1.179.0 crashes on.
  UV_PYTHON: "3.14"

jobs:
  integration:
    if: inputs.run-integration
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    timeout-minutes: 120
    permissions:
      contents: read # the checkout
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.integration-branch }}
          persist-credentials: false

      - name: Free disk
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false

      # The binary cache (spec S15): none, cachix:<name> or attic:<endpoint>/<cache>. Only a
      # push or schedule on the integration branch ever sees the write token.
      - id: cache
        name: Binary cache and private sources
        env:
          CACHE: ${{ inputs.nix-cache }}
          OVERRIDE: ${{ inputs.frappe-nix-override }}
          FETCH_TOKEN: ${{ secrets.FETCH_TOKEN }}
        run: |
          set -euo pipefail
          case "$CACHE" in
            "") echo "kind=none" >> "$GITHUB_OUTPUT" ;;
            cachix:*) echo "kind=cachix" >> "$GITHUB_OUTPUT"; echo "name=${CACHE#cachix:}" >> "$GITHUB_OUTPUT" ;;
            attic:*/*)
              rest="${CACHE#attic:}"
              echo "kind=attic" >> "$GITHUB_OUTPUT"
              echo "endpoint=${rest%/*}" >> "$GITHUB_OUTPUT"
              echo "name=${rest##*/}" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::nix-cache must be empty, cachix:<name> or attic:<endpoint>/<cache>, not $CACHE"; exit 1 ;;
          esac
          if [ -n "$CACHE" ] && [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
            # A self-hosted runner's home outlives the job: the cache's credentials stay in the job's temp dir.
            mkdir -p "$RUNNER_TEMP/config"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/config" >> "$GITHUB_ENV"
          fi
          if [ -n "$FETCH_TOKEN" ]; then
            echo "NIX_CONFIG=access-tokens = github.com=$FETCH_TOKEN" >> "$GITHUB_ENV"
            echo "FRAPPE_NIX_FETCH_TOKEN=$FETCH_TOKEN" >> "$GITHUB_ENV"
          fi
          if [ -n "$OVERRIDE" ]; then
            # frappe-nix's self-test: every nix call uses this checkout of frappe-nix.
            echo "NIX_OVERRIDE=--override-input frappe-nix path:$GITHUB_WORKSPACE/$OVERRIDE" >> "$GITHUB_ENV"
          else
            echo "NIX_OVERRIDE=" >> "$GITHUB_ENV"
          fi

      - if: steps.cache.outputs.kind == 'cachix'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ steps.cache.outputs.name }}
          authToken: ${{ (github.ref == format('refs/heads/{0}', inputs.integration-branch) && (github.event_name == 'push' || github.event_name == 'schedule')) && secrets.NIX_CACHE_TOKEN || secrets.NIX_CACHE_READ_TOKEN }}
          skipPush: ${{ !(github.ref == format('refs/heads/{0}', inputs.integration-branch) && (github.event_name == 'push' || github.event_name == 'schedule')) }}

      - if: steps.cache.outputs.kind == 'attic'
        name: attic
        env:
          TOKEN: ${{ (github.ref == format('refs/heads/{0}', inputs.integration-branch) && (github.event_name == 'push' || github.event_name == 'schedule')) && secrets.NIX_CACHE_TOKEN || secrets.NIX_CACHE_READ_TOKEN }}
          ENDPOINT: ${{ steps.cache.outputs.endpoint }}
          NAME: ${{ steps.cache.outputs.name }}
        run: |
          set -euo pipefail
          # Not `nix profile install`: a self-hosted runner's profile outlives the job.
          attic="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#attic-client^out)/bin"
          echo "$attic" >> "$GITHUB_PATH"
          PATH="$attic:$PATH"
          attic login ci "$ENDPOINT" ${TOKEN:+"$TOKEN"}
          attic use "ci:$NAME"

      # No FRAPPE_NIX_CI: `bench build` needs the node modules the shell installs.
      - name: frappe-test, bench build and the nightly suites
        run: |
          set -euo pipefail
          read -ra override <<< "$NIX_OVERRIDE"
          mkdir -p .dev-dist
          # shellcheck disable=SC2016 # the dev shell's frappe-nix expands it
          nix develop --no-pure-eval "${override[@]}" --profile .dev-dist/devshell-profile \
            -c bash -c 'bash "$(frappe-nix data-path ci/nightly.sh)"'

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly
          path: .dev-dist/
          if-no-files-found: ignore
          include-hidden-files: true

      - if: success() && steps.cache.outputs.kind == 'attic' && github.ref == format('refs/heads/{0}', inputs.integration-branch) && (github.event_name == 'push' || github.event_name == 'schedule')
        name: Push to the attic cache
        env:
          TOKEN: ${{ secrets.NIX_CACHE_TOKEN }}
          ENDPOINT: ${{ steps.cache.outputs.endpoint }}
          NAME: ${{ steps.cache.outputs.name }}
        run: |
          set -euo pipefail
          attic login ci "$ENDPOINT" "$TOKEN"
          paths=()
          for p in ./result .dev-dist/devshell-profile; do
            if [ -e "$p" ]; then
              paths+=("$p")
            fi
          done
          if [ "${#paths[@]}" -gt 0 ]; then
            attic push "ci:$NAME" "${paths[@]}"
          fi

  # Runs the app (frappe-shots over its demo site): no write token and no secret but the read
  # ones. It uploads the screenshot patch shots-push checks and pushes.
  shots:
    if: inputs.run-shots
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    timeout-minutes: 90
    permissions:
      contents: read # the checkout; this job runs the app and holds no write token
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      sha: ${{ steps.patch.outputs.sha }}
      diffs: ${{ steps.diffs.outputs.artifact-url }}
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.integration-branch }}
          persist-credentials: false

      - id: spec
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch marketplace/screenshots.ts > /dev/null 2>&1; then
            echo "tracked=true" >> "$GITHUB_OUTPUT"
          else
            echo "tracked=false" >> "$GITHUB_OUTPUT"
            echo "::notice::marketplace/screenshots.ts is not tracked; no screenshots to refresh"
          fi

      - if: steps.spec.outputs.tracked == 'true' && runner.environment == 'github-hosted'
        name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - if: steps.spec.outputs.tracked == 'true' && runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      # The binary cache (spec S15): none, cachix:<name> or attic:<endpoint>/<cache>. Only a
      # push or schedule on the integration branch ever sees the write token.
      - if: steps.spec.outputs.tracked == 'true'
        id: cache
        name: Binary cache and private sources
        env:
          CACHE: ${{ inputs.nix-cache }}
          OVERRIDE: ${{ inputs.frappe-nix-override }}
          FETCH_TOKEN: ${{ secrets.FETCH_TOKEN }}
        run: |
          set -euo pipefail
          case "$CACHE" in
            "") echo "kind=none" >> "$GITHUB_OUTPUT" ;;
            cachix:*) echo "kind=cachix" >> "$GITHUB_OUTPUT"; echo "name=${CACHE#cachix:}" >> "$GITHUB_OUTPUT" ;;
            attic:*/*)
              rest="${CACHE#attic:}"
              echo "kind=attic" >> "$GITHUB_OUTPUT"
              echo "endpoint=${rest%/*}" >> "$GITHUB_OUTPUT"
              echo "name=${rest##*/}" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::nix-cache must be empty, cachix:<name> or attic:<endpoint>/<cache>, not $CACHE"; exit 1 ;;
          esac
          if [ -n "$CACHE" ] && [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
            # A self-hosted runner's home outlives the job: the cache's credentials stay in the job's temp dir.
            mkdir -p "$RUNNER_TEMP/config"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/config" >> "$GITHUB_ENV"
          fi
          if [ -n "$FETCH_TOKEN" ]; then
            echo "NIX_CONFIG=access-tokens = github.com=$FETCH_TOKEN" >> "$GITHUB_ENV"
            echo "FRAPPE_NIX_FETCH_TOKEN=$FETCH_TOKEN" >> "$GITHUB_ENV"
          fi
          if [ -n "$OVERRIDE" ]; then
            # frappe-nix's self-test: every nix call uses this checkout of frappe-nix.
            echo "NIX_OVERRIDE=--override-input frappe-nix path:$GITHUB_WORKSPACE/$OVERRIDE" >> "$GITHUB_ENV"
          else
            echo "NIX_OVERRIDE=" >> "$GITHUB_ENV"
          fi

      - if: steps.spec.outputs.tracked == 'true' && (steps.cache.outputs.kind == 'cachix')
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ steps.cache.outputs.name }}
          authToken: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          skipPush: true

      - if: steps.spec.outputs.tracked == 'true' && (steps.cache.outputs.kind == 'attic')
        name: attic
        env:
          TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          ENDPOINT: ${{ steps.cache.outputs.endpoint }}
          NAME: ${{ steps.cache.outputs.name }}
        run: |
          set -euo pipefail
          # Not `nix profile install`: a self-hosted runner's profile outlives the job.
          attic="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#attic-client^out)/bin"
          echo "$attic" >> "$GITHUB_PATH"
          PATH="$attic:$PATH"
          attic login ci "$ENDPOINT" ${TOKEN:+"$TOKEN"}
          attic use "ci:$NAME"

      # Replaces a committed screenshot only when at least screenshots.change-threshold of its
      # pixels differ (a new, resized or removed shot always counts; docs/app-standards/spec.md
      # §5.5). When none does, docs/screenshots is unchanged and nothing is pushed below.
      - if: steps.spec.outputs.tracked == 'true'
        name: frappe-shots --update
        run: |
          set -euo pipefail
          read -ra override <<< "$NIX_OVERRIDE"
          nix develop --no-pure-eval "${override[@]}" -c frappe-shots --update

      - if: always() && steps.spec.outputs.tracked == 'true'
        id: diffs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: .dev-dist/shots/
          if-no-files-found: ignore
          include-hidden-files: true

      # docs/screenshots alone, as a binary patch without renames; shots-push checks it again.
      - if: steps.spec.outputs.tracked == 'true'
        id: patch
        name: The screenshot patch
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain -- docs/screenshots)" ]; then
            echo "The committed screenshots match."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A -- docs/screenshots
          git diff --cached --binary --no-renames -- docs/screenshots > "$RUNNER_TEMP/shots.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-patch
          path: ${{ runner.temp }}/shots.patch

  # Holds the write token: GitHub-hosted whatever `runs-on` says, and nothing of the app's runs.
  shots-push:
    needs: shots
    if: needs.shots.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push standards/screenshots
      pull-requests: write # open or update its PR
      actions: write # dispatch ci.yml and pr-policy.yml on it
    steps:
      # The integration branch with its history, then the commit the plan job ran on, which that
      # job names itself: only a full SHA the integration branch already holds, so this job never
      # builds on a commit the branch has not taken (a fork PR's head can be fetched from this
      # repository by its SHA). The branch's head stays in $RUNNER_TEMP/base, where
      # enable-automerge reads the gates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.integration-branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the plan job's commit, only if it is on the integration branch
        env:
          SHA: ${{ needs.shots.outputs.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the plan job's commit ${SHA@Q} is not a full SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" HEAD; then
            echo "::error::the plan job's commit $SHA is not on the integration branch"
            exit 1
          fi
          git worktree add -q --detach "$RUNNER_TEMP/base" HEAD
          git switch -q --detach "$SHA"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots-patch
          path: ${{ runner.temp }}/shots

      # The shots job ran the app and its dependencies, so its patch is data to check, before
      # any token exists: only what frappe-shots writes (docs/screenshots/<name>-<theme>.webp
      # and docs/screenshots/manifest.json), each an added, modified or deleted regular file
      # (mode 100644). A rename, copy, mode change, symlink, or any other path is refused.
      - name: Check and apply the screenshot patch (nothing else runs)
        env:
          PATCH: ${{ runner.temp }}/shots/shots.patch
          ALLOW: '^docs/screenshots/([a-z0-9-]+-(light|dark)\.webp|manifest\.json)$'
        run: |
          set -euo pipefail
          # The patch text first: no rename, copy or mode change, and no mode but 100644.
          if grep -qE '^((rename|copy) (from|to)|(dis)?similarity index|(old|new) mode) ' "$PATCH" \
            || grep -E '^(new file|deleted file) mode ' "$PATCH" | grep -vE ' mode 100644$' > /dev/null \
            || grep -E '^index [0-9a-f]+\.\.[0-9a-f]+ ' "$PATCH" | grep -vE ' 100644$' > /dev/null; then
            echo "::error::the patch renames, copies or changes the mode of a file, or has a mode other than 100644"
            exit 1
          fi
          git apply --index "$PATCH"
          # Then what the index holds against HEAD, entry by entry.
          git diff --cached --no-renames --raw -z HEAD > "$RUNNER_TEMP/index.raw"
          bad=0
          while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
            read -r old new _ _ status <<< "${meta#:}"
            why=""
            case "$status" in
              A) [ "$new" = 100644 ] || why="mode $new" ;;
              M) { [ "$old" = 100644 ] && [ "$new" = 100644 ]; } || why="mode $old to $new" ;;
              D) [ "$old" = 100644 ] || why="mode $old" ;;
              *) why="change type $status" ;;
            esac
            if [[ "/$path/" == *//* || "/$path/" == */./* || "/$path/" == */../* || "/$path/" == */.github/* ]]; then
              why="${why:+$why; }path"
            elif ! [[ "$path" =~ $ALLOW ]]; then
              why="${why:+$why; }not a path this job pushes"
            fi
            if [ "$status" != D ] && [ -L "$path" ]; then
              why="${why:+$why; }symlink"
            fi
            if [ -n "$why" ]; then
              echo "::error::refusing ${path@Q}: $why"
              bad=1
            fi
          done < "$RUNNER_TEMP/index.raw"
          if [ "$bad" != 0 ]; then
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/index.raw" ]; then
            echo "::error::the patch changes nothing"
            exit 1
          fi
          git --no-pager diff --cached --stat HEAD

      - if: inputs.auto-merge
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: "false"

      # This job can hold the App's key, so nothing it installs is resolved at run time:
      # frappe-nix-tools from Avunu/frappe-nix alone, at the full revision the integration branch's
      # flake.lock pins (never the PR's), every dependency from that revision's
      # py/frappe_nix_tools/uv.lock by hash and as a wheel, and only frappe-nix-tools itself built,
      # against a hashed flit_core. uv is pinned above, without its cache, and reads no
      # configuration. Before the App's token is minted.
      - if: inputs.auto-merge
        name: Install frappe-nix-tools, hash-locked, at the frappe-nix revision the integration branch pins
        env:
          OVERRIDE: ${{ inputs.frappe-nix-override }}
          INTEGRATION: ${{ inputs.integration-branch }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FLIT_CORE: flit-core==3.12.0 --hash=sha256:e7a0304069ea895172e3c7bb703292e992c5d1555dd1233ab7b5621b5b69e62c
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/frappe-nix-tools"
          mkdir -p "$tools/bin"
          if [ -n "$OVERRIDE" ]; then
            project="$GITHUB_WORKSPACE/$OVERRIDE/py/frappe_nix_tools"
          else
            node="$(gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/flake.lock?ref=$INTEGRATION" \
              | jq -c '.nodes[.nodes.root.inputs["frappe-nix"]].locked')"
            src="$(jq -r '"\(.owner)/\(.repo)"' <<<"$node")"
            rev="$(jq -r .rev <<<"$node")"
            if [ "${src,,}" != avunu/frappe-nix ] || ! [[ "$rev" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::flake.lock locks frappe-nix at ${src@Q} ${rev@Q}: a job that can hold the App's key installs frappe-nix-tools only from Avunu/frappe-nix at a full revision"
              exit 1
            fi
            git init -q "$tools/src"
            git -C "$tools/src" fetch -q --depth 1 --no-tags https://github.com/Avunu/frappe-nix.git "$rev"
            git -C "$tools/src" -c advice.detachedHead=false checkout -q FETCH_HEAD
            project="$tools/src/py/frappe_nix_tools"
          fi
          uv --no-config export -q --frozen --no-dev --no-emit-project --no-header --project "$project" \
            -o "$tools/requirements.txt"
          echo "$FLIT_CORE" > "$tools/build.txt"
          uv --no-config venv -q --python 3.14 --no-project "$tools/venv"
          uv --no-config pip install -q --python "$tools/venv/bin/python" --require-hashes --no-build \
            -r "$tools/requirements.txt" -r "$tools/build.txt"
          uv --no-config pip install -q --python "$tools/venv/bin/python" --offline --no-deps --no-build-isolation "$project"
          ln -s "$tools/venv/bin/frappe-nix" "$tools/bin/frappe-nix"
          echo "$tools/bin" >> "$GITHUB_PATH"

      # A GitHub App's token when the caller passes one (ci.github-app), minted in this job
      # alone, which runs no app code: the PR it pushes then starts CI like any other push.
      # Else GITHUB_TOKEN.
      - id: app
        name: Whether the caller passes a GitHub App
        env:
          ENABLED: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
        run: echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

      - if: steps.app.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the screenshots PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP: ${{ steps.app.outputs.enabled }}
          INTEGRATION: ${{ inputs.integration-branch }}
          DIFFS: ${{ needs.shots.outputs.diffs }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
          METHOD: ${{ inputs.merge-method }}
        run: |
          set -euo pipefail
          branch=standards/screenshots
          git switch -c "$branch"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "docs: refresh screenshots"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$branch"
          gh label create screenshots --repo "$GITHUB_REPOSITORY" --color c5def5 --description "Screenshot refresh from nightly" --force
          url="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json url --jq '.[0].url // ""')"
          if [ -z "$url" ]; then
            if [ "$AUTO_MERGE" = true ]; then
              review="It merges once the required checks pass. The diff images"
            else
              review="Review the diff images before merging"
            fi
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$INTEGRATION" --head "$branch" --label screenshots \
              --title "docs: refresh screenshots" \
              --body "The nightly frappe-shots run found changed screenshots. $review: ${DIFFS:-the screenshot-diffs artifact}")"
          fi
          if [ "$APP" != true ]; then
            # A GITHUB_TOKEN push raises no event.
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
            if [ -f .github/workflows/pr-policy.yml ]; then
              gh workflow run pr-policy.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
            fi
          fi
          if [ "$AUTO_MERGE" = true ]; then
            # The gates the integration branch's head requires, not the plan job's commit's.
            (cd "$RUNNER_TEMP/base" && frappe-nix ci enable-automerge --pr-url "$url" --integration "$INTEGRATION" --merge-method "$METHOD")
          fi
          echo "Screenshots changed: $url (diff images: ${DIFFS:-the screenshot-diffs artifact})" >> "$GITHUB_STEP_SUMMARY"

  links:
    if: inputs.run-links
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    permissions:
      contents: read # the checkout
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.integration-branch }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          tool-dir: ${{ runner.temp }}/uv-tool-dir
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin-dir

      - name: Install frappe-nix-tools at the frappe-nix revision flake.lock pins
        env:
          OVERRIDE: ${{ inputs.frappe-nix-override }}
          FETCH_TOKEN: ${{ secrets.FETCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$FETCH_TOKEN" ]; then
            echo "FRAPPE_NIX_FETCH_TOKEN=$FETCH_TOKEN" >> "$GITHUB_ENV"
          fi
          if [ -n "$OVERRIDE" ]; then
            uv tool install --python 3.14 "$GITHUB_WORKSPACE/$OVERRIDE/py/frappe_nix_tools"
            echo "FRAPPE_NIX_ALLOW_SKEW=1" >> "$GITHUB_ENV"      # self-test only (spec §3.7)
            echo "FRAPPE_NIX_EXPECT_REV=" >> "$GITHUB_ENV"
          else
            node="$(jq -c '.nodes[.nodes.root.inputs["frappe-nix"]].locked' flake.lock)"
            rev="$(jq -r .rev <<<"$node")"
            src="$(jq -r '"\(.owner)/\(.repo)"' <<<"$node")"   # the frappe-nix repository the app locks, or a fork
            uv tool install --python 3.14 "frappe-nix-tools @ git+https://github.com/${src}@${rev}#subdirectory=py/frappe_nix_tools"
            echo "FRAPPE_NIX_EXPECT_REV=$rev" >> "$GITHUB_ENV"
          fi

      - id: cfg
        run: frappe-nix config --github-output modules

      - name: The listing's website and documentation answer 200
        run: frappe-nix listing check --links-only --format github

      - if: steps.cfg.outputs.icons == 'true' && runner.environment == 'github-hosted'
        name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - if: steps.cfg.outputs.icons == 'true' && runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      # The binary cache (spec S15): none, cachix:<name> or attic:<endpoint>/<cache>. Only a
      # push or schedule on the integration branch ever sees the write token.
      - if: steps.cfg.outputs.icons == 'true'
        id: cache
        name: Binary cache and private sources
        env:
          CACHE: ${{ inputs.nix-cache }}
          OVERRIDE: ${{ inputs.frappe-nix-override }}
          FETCH_TOKEN: ${{ secrets.FETCH_TOKEN }}
        run: |
          set -euo pipefail
          case "$CACHE" in
            "") echo "kind=none" >> "$GITHUB_OUTPUT" ;;
            cachix:*) echo "kind=cachix" >> "$GITHUB_OUTPUT"; echo "name=${CACHE#cachix:}" >> "$GITHUB_OUTPUT" ;;
            attic:*/*)
              rest="${CACHE#attic:}"
              echo "kind=attic" >> "$GITHUB_OUTPUT"
              echo "endpoint=${rest%/*}" >> "$GITHUB_OUTPUT"
              echo "name=${rest##*/}" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::nix-cache must be empty, cachix:<name> or attic:<endpoint>/<cache>, not $CACHE"; exit 1 ;;
          esac
          if [ -n "$CACHE" ] && [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
            # A self-hosted runner's home outlives the job: the cache's credentials stay in the job's temp dir.
            mkdir -p "$RUNNER_TEMP/config"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/config" >> "$GITHUB_ENV"
          fi
          if [ -n "$FETCH_TOKEN" ]; then
            echo "NIX_CONFIG=access-tokens = github.com=$FETCH_TOKEN" >> "$GITHUB_ENV"
            echo "FRAPPE_NIX_FETCH_TOKEN=$FETCH_TOKEN" >> "$GITHUB_ENV"
          fi
          if [ -n "$OVERRIDE" ]; then
            # frappe-nix's self-test: every nix call uses this checkout of frappe-nix.
            echo "NIX_OVERRIDE=--override-input frappe-nix path:$GITHUB_WORKSPACE/$OVERRIDE" >> "$GITHUB_ENV"
          else
            echo "NIX_OVERRIDE=" >> "$GITHUB_ENV"
          fi

      - if: steps.cfg.outputs.icons == 'true' && (steps.cache.outputs.kind == 'cachix')
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ steps.cache.outputs.name }}
          authToken: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          skipPush: true

      - if: steps.cfg.outputs.icons == 'true' && (steps.cache.outputs.kind == 'attic')
        name: attic
        env:
          TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          ENDPOINT: ${{ steps.cache.outputs.endpoint }}
          NAME: ${{ steps.cache.outputs.name }}
        run: |
          set -euo pipefail
          # Not `nix profile install`: a self-hosted runner's profile outlives the job.
          attic="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#attic-client^out)/bin"
          echo "$attic" >> "$GITHUB_PATH"
          PATH="$attic:$PATH"
          attic login ci "$ENDPOINT" ${TOKEN:+"$TOKEN"}
          attic use "ci:$NAME"

      - if: steps.cfg.outputs.icons == 'true'
        name: The icon raster checks, with the app's locked resvg
        run: |
          set -euo pipefail
          read -ra override <<< "$NIX_OVERRIDE"
          nix run --no-pure-eval "${override[@]}" .#frappe-icon -- check

  duplication:
    if: inputs.run-duplication
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read # the checkout
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.integration-branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          tool-dir: ${{ runner.temp }}/uv-tool-dir
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin-dir

      # Informational: jscpd through npx, with the network.
      - name: check_code_duplication
        run: |
          set -euo pipefail
          uv sync --frozen --project tools
          uv run --frozen --project tools prek run --hook-stage manual check_code_duplication --all-files

  drift:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    permissions:
      contents: read # the checkout
      issues: write # the reminder issues
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.integration-branch }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          tool-dir: ${{ runner.temp }}/uv-tool-dir
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin-dir

      - name: The latest frappe-nix release, and the app's drift against it
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.frappe-nix-override }}
        run: |
          set -euo pipefail
          src="$(jq -r '.nodes[.nodes.root.inputs["frappe-nix"]].locked | "\(.owner)/\(.repo)"' flake.lock)"
          latest="$(gh api "repos/$src/releases/latest" --jq .tag_name 2> /dev/null || true)"
          if [ -z "$latest" ]; then
            echo "::notice::$src has no release yet; nothing to compare"
            exit 0
          fi
          if [ -n "$OVERRIDE" ]; then
            uv tool install --python 3.14 "$GITHUB_WORKSPACE/$OVERRIDE/py/frappe_nix_tools"
          else
            uv tool install --python 3.14 "frappe-nix-tools @ git+https://github.com/${src}@${latest}#subdirectory=py/frappe_nix_tools"
          fi
          FRAPPE_NIX_ALLOW_SKEW=1 frappe-nix sync --check --format json > "$RUNNER_TEMP/drift.json" || true
          frappe-nix ci drift --repo "$GITHUB_REPOSITORY" --latest "$latest" --summary-file "$RUNNER_TEMP/drift.json"

  registry-refresh:
