name: selftest-assets

# N2's self-test (docs/app-standards/spec.md §7, "N2: assets"): Vite manifest
# registration (S30, §5.11) on real benches, with the spa-app fixture
# (tests/fixtures/spa-app). The network-free halves are flake checks
# (tests/standards/assets.nix, in check.yml's standards-all). Each job is
# tests/standards/selftest-assets/run.sh, which runs the same way by hand.
#
#   stock       a plain `bench init` bench, no Nix and no NODE_OPTIONS: the
#               app's own scripts/vite-register.mjs registers spa.bundle.js and
#               spa.bundle.css; a second build under frappe-nix's preload
#               changes no byte of assets.json, and the preload alone registers
#               them; --hard-link copies the hashed bundles into sites/assets.
#               Two legs: frappe as dev/pyproject.toml pins it, and frappe
#               develop's tip, whose esbuild.js runs each app's build with
#               spawn instead of execSync (the preload wraps both)
#   builtbench  the fixture locked against this checkout, `nix build
#               .#builtBench`: its assets.json maps the bundles; and again
#               with no registration step of the app's own (Q7: the preload
#               is the only registrar for an app that has not opted in)

# The registration's code, the preload and how Nix hands it to frappe's build,
# the fixture, and the pins. Also on main and weekly, so a change that slips
# past the paths (or a moved input) still shows up.
on:
  pull_request:
    paths:
      - .github/workflows/selftest-assets.yml
      - dev/pyproject.toml
      - flake.lock
      - flake.nix
      - lib/bench.nix
      - lib/js/**
      - lib/nodebuild/**
      - lib/python.nix
      - modules/devenv.nix
      - py/frappe_nix_tools/frappe_nix_tools/data/manifest.d/assets.json
      - py/frappe_nix_tools/frappe_nix_tools/data/templates/scripts/**
      - tests/fixtures/spa-app/**
      - tests/standards/selftest-assets/**
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR replaces its run; main's pushes and the weekly run
# always finish, each in a group of its own.
concurrency:
  group: selftest-assets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stock:
    name: stock (${{ matrix.frappe }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        frappe: [pinned, develop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # frappe's Python dependencies include mysqlclient, built against these.
      - name: Install the MariaDB client headers
        run: sudo apt-get update -q && sudo apt-get install -y -q libmariadb-dev pkg-config

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          tool-dir: ${{ runner.temp }}/uv-tool-dir
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin-dir

      # frappe 16 wants node >= 24; its build runs yarn classic.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install Python 3.14, the bench CLI and yarn
        run: | # zizmor: ignore[adhoc-packages]
          uv python install 3.14
          uv tool install frappe-bench
          # yarn classic, pinned: what the stock bench builds with.
          npm install -g yarn@1.22.22
          git config --global user.name selftest
          git config --global user.email selftest@localhost

      - name: Run stock
        env:
          FRAPPE_REF: ${{ matrix.frappe == 'develop' && 'develop' || '' }}
        run: PYTHON="$(uv python find 3.14)" tests/standards/selftest-assets/run.sh stock

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: selftest-assets-stock-${{ matrix.frappe }}
          path: |
            ${{ runner.temp }}/standards-n2/*.log
            ${{ runner.temp }}/standards-n2/*.json
            ${{ runner.temp }}/standards-n2/bench/sites/assets/assets.json
          if-no-files-found: ignore

  builtbench:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 120
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # run.sh dates the PyPI resolution by the last change to the pins.
          fetch-depth: 0

      # A Frappe bench is more than the hosted runner's free disk.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        if: runner.environment == 'github-hosted'
        with:
          diagnostic-endpoint: ""
          use-flakehub: false

      - name: Run builtbench
        run: tests/standards/selftest-assets/run.sh builtbench

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: selftest-assets-builtbench
          path: ${{ runner.temp }}/standards-n2/*.log
          if-no-files-found: ignore
