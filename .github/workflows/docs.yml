name: Docs

# Checks the documentation on every pull request, against the shared site at docs.avunu.net. The work is
# done by Avunu/site-docs's check-docs.yml, pinned to a commit: it builds the workspace with this pull
# request's docs/ in place of the frappe-nix submodule, so links to the other projects are checked too.
# The token is read-only and nothing here publishes: site-docs builds and deploys the site from the
# released submodule.
#
# The job stays named `build`: its check, `build / Check`, is the one the main ruleset requires. A
# required check has to report on every pull request or the ones that do not touch the pages wait for
# it for ever, so this workflow has no `paths:` filter (it takes about 30 seconds). The release PR is
# pushed with GITHUB_TOKEN, which raises no pull_request event, so release.yml's dispatch-ci runs it by
# workflow_dispatch on that branch.
on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read # checkout
    uses: Avunu/site-docs/.github/workflows/check-docs.yml@cb47d05d5a996a5eb0a6d2ef91c7cf8518180aa4 # 2026-10-16
    with:
      path: frappe-nix # its path in site-docs's projects.json
