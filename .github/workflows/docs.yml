name: Docs

# Builds the documentation site (docs-site/, from the Markdown in docs/) and publishes it to GitHub
# Pages at the project's address (https://<project>.avunu.net).
#
#   build    every pull request and every push to the default branch: `bun run check` (set-up check,
#            unit tests, colour contrast, a build in which any document problem fails, and a link
#            check of the built site). Pull requests also get the built site as a downloadable artifact.
#   deploy   pushes to the default branch and manual runs on it only: configure-pages, then
#            deploy-pages into the `github-pages` environment.
#
# The branch in `on.push.branches` is the repository's default branch: `init` writes it there (it
# cannot be an expression), and the deploy job compares against github.event.repository.default_branch,
# so a site never publishes from anything else.
#
# Every job is gated by the repository variable DOCS_SITE_ENABLED: until a maintainer has enabled
# GitHub Pages (Settings > Pages > Source: GitHub Actions) and set the variable to `true`, the
# workflow runs, skips everything and stays green. The README of the site says how.
#
# DOCS_JX_REF (optional repository variable): the full commit SHA of jxsuite/jx to build and use
# instead of the npm packages. Needed only while the Jx release with the vault-content features is
# unpublished; delete the variable once the site installs a release that has them. A branch or tag
# is refused: the job that builds it makes the site that is deployed, so the code must not be able
# to change between a review and the build.
#
# The path filter keeps commits that do not touch the documentation from rebuilding it. Do not make
# this workflow a required check unless the filter is removed: a skipped path-filtered workflow
# leaves the check pending.
on:
  pull_request:
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Nothing gets a token by default; each job asks for what it needs.
permissions: {}

concurrency:
  # A newer push to a pull request supersedes the older run; main and manual runs always finish.
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    if: ${{ vars.DOCS_SITE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout only
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"
          no-cache: true # the install is a few seconds, and a shared cache is a poisoning risk for a deploy job

      - name: Require a commit SHA for Jx (pre-release builds only)
        if: ${{ vars.DOCS_JX_REF != '' }}
        env:
          JX_REF: ${{ vars.DOCS_JX_REF }}
        run: |
          if ! [[ "$JX_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=DOCS_JX_REF::must be a full 40-character commit SHA of jxsuite/jx, not a branch or tag (got '$JX_REF')"
            exit 1
          fi

      - name: Check out Jx (pre-release builds only)
        if: ${{ vars.DOCS_JX_REF != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jxsuite/jx
          ref: ${{ vars.DOCS_JX_REF }}
          path: .jx
          persist-credentials: false

      - name: Build Jx (pre-release builds only)
        if: ${{ vars.DOCS_JX_REF != '' }}
        working-directory: .jx
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Use the Jx build (pre-release builds only)
        if: ${{ vars.DOCS_JX_REF != '' }}
        run: bun run link:jx "$GITHUB_WORKSPACE/.jx"

      # A build must not depend on avunu.net being up: --soft keeps the committed snapshot when the
      # catalog cannot be fetched or is not valid.
      - name: Refresh the project catalog for the switcher
        run: bun scripts/sync-projects.ts --soft

      - name: Check and build
        run: bun run check

      - name: Upload the site for review
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: docs-site/dist
          retention-days: 7
          if-no-files-found: error

      - name: Package the site for GitHub Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  deploy:
    name: Deploy
    needs: build
    if: ${{ vars.DOCS_SITE_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact
      id-token: write # prove to Pages that this run made it
    concurrency:
      group: pages
      cancel-in-progress: false # never cancel a deployment half way
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails with a plain message when Pages is not enabled, before anything is published.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
