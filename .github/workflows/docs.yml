name: Docs

# Checks the documentation on every pull request that touches it, against the shared site at
# docs.avunu.net. The work is done by Avunu/site-docs's check-docs.yml, pinned to a commit (Dependabot's
# github-actions entry moves the pin): it builds the workspace with this pull request's docs/ in place of
# the frappe-nix submodule, so links to the other projects are checked too. The token is read-only and
# nothing here publishes: site-docs builds and deploys the site from the released submodule.
#
# The job stays named `build`: its check, `build / Check`, is the one the main ruleset requires.
on:
  pull_request:
    paths:
      - docs/**
      - .github/workflows/docs.yml

permissions: {}

concurrency:
  group: docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read # checkout
    uses: Avunu/site-docs/.github/workflows/check-docs.yml@2e7a51919ee26a518c2769d3cd64549d009f2fe5 # 2026-10-16
    with:
      path: frappe-nix # its path in site-docs's projects.json
