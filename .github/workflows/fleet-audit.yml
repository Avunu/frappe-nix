name: fleet-audit

# The fleet scorecard (docs/app-standards/github.md, spec §5.7), reusable only: an
# organisation schedules it from its own profile repository, which holds the fleet list
# and the read-only FRAPPE_NIX_AUDIT_TOKEN (Administration and Contents read on the
# fleet's repositories). Without that token the settings and ruleset rows are `unknown`.

on:
  workflow_call:
    inputs:
      fleet:
        description: the fleet list, a path in the caller's checkout (fleet.json)
        type: string
        required: true
      issue-repo:
        description: "the repository (<owner>/<repo>) that holds the scorecard issues; empty for none"
        type: string
        default: ""
      frappe-nix-version:
        description: the frappe-nix release (vX.Y.Z) or revision whose frappe-nix-tools runs the audit
        type: string
        required: true
      runs-on:
        description: >-
          The runner of every Linux job, as JSON: a label or a list of labels
          (`["self-hosted", "nixos"]`). A pull request from a fork always runs on ubuntu-latest.
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      FRAPPE_NIX_AUDIT_TOKEN:
        required: false

permissions: {}

env:
  FORCE_COLOR: "1"

jobs:
  audit:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read # the caller's checkout, with the fleet list
      issues: write # the scorecard issues in the caller's repository
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          tool-dir: ${{ runner.temp }}/uv-tool-dir
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin-dir

      - name: Install frappe-nix-tools
        env:
          VERSION: ${{ inputs.frappe-nix-version }}
        run: |
          set -euo pipefail
          uv tool install --python 3.14 "frappe-nix-tools @ git+https://github.com/Avunu/frappe-nix@${VERSION}#subdirectory=py/frappe_nix_tools"

      - name: frappe-nix repo audit
        env:
          AUDIT_TOKEN: ${{ secrets.FRAPPE_NIX_AUDIT_TOKEN }}
          ISSUE_TOKEN: ${{ github.token }}
          FLEET: ${{ inputs.fleet }}
          ISSUE_REPO: ${{ inputs.issue-repo }}
        run: |
          set -euo pipefail
          if [ -z "$AUDIT_TOKEN" ]; then
            echo "::notice::FRAPPE_NIX_AUDIT_TOKEN is not set: rows that need it read as unknown"
            AUDIT_TOKEN="$ISSUE_TOKEN"
          fi
          args=(--all --fleet "$FLEET" --format md --out "$RUNNER_TEMP/scorecard.md")
          if [ -n "$ISSUE_REPO" ]; then
            args+=(--issue --issue-repo "$ISSUE_REPO")
          fi
          rc=0
          GH_TOKEN="$AUDIT_TOKEN" FRAPPE_NIX_ISSUE_TOKEN="$ISSUE_TOKEN" frappe-nix repo audit "${args[@]}" || rc=$?
          if [ -f "$RUNNER_TEMP/scorecard.md" ]; then
            cat "$RUNNER_TEMP/scorecard.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
