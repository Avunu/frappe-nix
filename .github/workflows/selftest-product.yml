name: selftest-product

# N5's self-test (docs/app-standards/spec.md §7, "N5: product tools"): frappe-listing,
# frappe-demo and frappe-shots run for real against the fixture app
# (tests/fixtures/standards-app) on the fictitious example-org profile, which turns every
# module on. Each job is tests/standards/selftest-product/run.sh, which runs the same way by
# hand. The offline halves (the rules case by case, the README blocks, frappe-icon with
# resvg) are flake checks: tests/standards/product.nix and the package's unit tests, in
# check.yml's standards-all.
#
#   listing       no Nix, as an app's `ci / marketplace` job runs: frappe-nix listing check
#                 with L9 on the pinned pilot (the job's apt packages only), timed against
#                 25 minutes; a planted finding fails L7; registry --dry-run --onboard
#                 matches the pinned tools/add_release.py byte for byte
#   shots         frappe-demo twice leaves every count unchanged; frappe-shots from two fresh
#                 sites is pixel-identical; --check against the committed shots exits 0; a
#                 1-pixel CSS change exits 1 with a diff PNG
#   demo-erpnext  frappe-demo with erpnext installed makes demo.company-name's company
#
# Nothing here opens a registry pull request: `frappe-listing registry` runs only as a dry
# run (it pushes only with --yes).

on:
  pull_request:
    paths:
      - .github/workflows/selftest-product.yml
      - flake.lock
      - lib/demo/**
      - lib/sh/frappe-demo.sh
      - lib/sh/frappe-shots.sh
      - lib/shots/**
      - lib/standards/tools/**
      - py/frappe_nix_tools/**
      - tests/fixtures/profiles/example-org/**
      - tests/fixtures/standards-app/**
      - tests/standards/selftest-product/**
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selftest-product-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # What the `marketplace` gate job installs (§4.2): mysqlclient has no Linux wheel, and
      # L9 installs frappe from source when the app imports what the bench lacks.
      - name: The marketplace job's packages
        run: sudo apt-get install -y --no-install-recommends pkg-config libmysqlclient-dev

      - name: Run listing
        run: tests/standards/selftest-product/run.sh listing

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest-product-listing
          path: |
            ${{ runner.temp }}/standards-n5/*.log
            ${{ runner.temp }}/standards-n5/listing/.dev-dist/marketplace/
          if-no-files-found: ignore
          include-hidden-files: true

  bench:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [shots, demo-erpnext]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # run.sh dates the PyPI resolution by the last change to the pins.
          fetch-depth: 0

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          diagnostic-endpoint: ""
          use-flakehub: false

      - name: Run ${{ matrix.suite }}
        env:
          SUITE: ${{ matrix.suite }}
        run: tests/standards/selftest-product/run.sh "$SUITE"

      - name: Bench logs
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/standards-n5/*/.frappe-nix/bench/logs/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            tail -n 200 "$f"
            echo "::endgroup::"
          done

      # The screenshots a run made, and the diffs: what a maintainer commits as the fixture's
      # docs/screenshots when the fixture's pages change.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest-product-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/standards-n5/*.log
            ${{ runner.temp }}/standards-n5/*.json
            ${{ runner.temp }}/standards-n5/shots-1/
            ${{ runner.temp }}/standards-n5/shots/.dev-dist/shots/
          if-no-files-found: ignore
          include-hidden-files: true
