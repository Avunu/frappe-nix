name: release

# frappe-nix's own releases (docs/app-standards/versioning.md, spec §6.2, §6.3, S6, S13). The
# org's GitHub App, when the repository can read it (the variable AVUNU_CI_APP_ID and the
# secret AVUNU_CI_PRIVATE_KEY), gives release-please and fixture a token whose pushes start
# CI on the release PR by themselves; without it they use GITHUB_TOKEN and dispatch-ci runs:
#
#   release-please  opens or updates the release PR on main, and on its merge tags vX.Y.Z
#                   (version.txt and both frappe-nix-tools version locations move together,
#                   release-please-config.json);
#   fixture         the release PR moves frappe-nix-tools' version, which the caller workflows
#                   of tests/fixtures/standards-app record (`@<sha> # v<version>`), so it
#                   re-renders them offline with the PR's own tools and pushes the result
#                   to the PR branch: every commit on main, the release's included, keeps
#                   fixtures that `frappe-nix sync --check` passes;
#   dispatch-ci     only without the App: a GITHUB_TOKEN push raises no event, so it
#                   dispatches check.yml (without inputs: `lint` and `flake`, no VM tests),
#                   pr-policy.yml and docs.yml (the main ruleset's required `build / Check`)
#                   on the release PR, each only while its check is absent on the PR's head;
#   fast-forward    moves `release` to the new tag, whatever its major, by a REST PATCH with
#                   force=false, or creates it when it does not exist, and fails unless it
#                   then equals the tag. The release ruleset
#                   (repo-policy/self/rulesets/release.json) lets only GitHub Actions move it.
#
# release-please, fixture and fast-forward can hold AVUNU_CI_PRIVATE_KEY, so they run on
# ubuntu-latest, never on the shared self-hosted runners other repositories' jobs use.
#
# The daily cron catches merges that raise no push (an auto-merge enabled with GITHUB_TOKEN)
# and retries a dispatch that failed or a concurrency group cancelled. frappe-nix's flake.lock
# has no frappe-nix node, so the tools come from this checkout.

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # tags and releases
      pull-requests: write # the release PR
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      sha: ${{ steps.rp.outputs.sha }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      app: ${{ steps.app.outputs.enabled }}
    steps:
      # The org's GitHub App when this repository can read it: the release PR it opens, updates
      # or pushes to then starts check.yml, pr-policy.yml and docs.yml. Else GITHUB_TOKEN.
      - id: app
        name: Whether the org's GitHub App is available
        env:
          ENABLED: ${{ vars.AVUNU_CI_APP_ID != '' && secrets.AVUNU_CI_PRIVATE_KEY != '' }}
        run: echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

      - if: steps.app.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AVUNU_CI_APP_ID }}
          private-key: ${{ secrets.AVUNU_CI_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - id: rp
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - if: steps.rp.outcome == 'failure'
        run: |
          echo "::error::release-please failed. If the log says GitHub Actions is not permitted to create pull requests, allow it under Settings > Actions > General > Workflow permissions (repo-policy/self/repo-settings.json sets can_approve_pull_request_reviews)."
          exit 1

  fixture:
    needs: release-please
    if: needs.release-please.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the re-rendered fixture to the release PR branch
      pull-requests: read # the open release PR
    steps:
      - name: Find the open release PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          head="$(gh pr list --repo "$REPO" --base main --state open --label 'autorelease: pending' \
            --json headRefName --jq '.[0].headRefName // ""')"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - if: steps.pr.outputs.head != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head }}
          persist-credentials: false

      - if: steps.pr.outputs.head != ''
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
          enable-cache: "false"

      # This job can hold the App's key, so nothing it installs is resolved at run time:
      # frappe-nix-tools from this checkout, every dependency from its
      # py/frappe_nix_tools/uv.lock by hash and as a wheel, and only frappe-nix-tools itself
      # built, against a hashed flit_core. uv is pinned above, without its cache, and reads no
      # configuration. Before the App's token is minted.
      - if: steps.pr.outputs.head != ''
        name: Install frappe-nix-tools, hash-locked, from this checkout
        env:
          FLIT_CORE: flit-core==3.12.0 --hash=sha256:e7a0304069ea895172e3c7bb703292e992c5d1555dd1233ab7b5621b5b69e62c
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/frappe-nix-tools"
          mkdir -p "$tools/bin"
          project="$GITHUB_WORKSPACE/py/frappe_nix_tools"
          uv --no-config export -q --frozen --no-dev --no-emit-project --no-header --project "$project" \
            -o "$tools/requirements.txt"
          echo "$FLIT_CORE" > "$tools/build.txt"
          uv --no-config venv -q --python 3.14 --no-project "$tools/venv"
          uv --no-config pip install -q --python "$tools/venv/bin/python" --require-hashes --no-build \
            -r "$tools/requirements.txt" -r "$tools/build.txt"
          uv --no-config pip install -q --python "$tools/venv/bin/python" --offline --no-deps --no-build-isolation "$project"
          ln -s "$tools/venv/bin/frappe-nix" "$tools/bin/frappe-nix"
          echo "$tools/bin" >> "$GITHUB_PATH"

      - if: steps.pr.outputs.head != ''
        name: Re-render the fixtures with the release PR's frappe-nix-tools
        run: |
          set -euo pipefail
          for fixture in standards-app spa-app; do
            app="$RUNNER_TEMP/$fixture"
            cp -r "tests/fixtures/$fixture" "$app"
            git -C "$app" init -q
            git -C "$app" add -A
            git -C "$app" -c user.name=ci -c user.email=ci@example.com commit -qm fixture
            (cd "$app" && frappe-nix sync --write --offline)
            (cd "$app" && git add -A && frappe-nix sync --check)
            git -C "$app" diff --cached --binary > "$RUNNER_TEMP/$fixture.patch"
            if [ -s "$RUNNER_TEMP/$fixture.patch" ]; then
              git apply --index --directory="tests/fixtures/$fixture" "$RUNNER_TEMP/$fixture.patch"
            fi
          done
          git diff --cached --stat

      # The org's GitHub App when this repository can read it: the release PR it opens, updates
      # or pushes to then starts check.yml, pr-policy.yml and docs.yml. Else GITHUB_TOKEN.
      - if: steps.pr.outputs.head != ''
        id: app
        name: Whether the org's GitHub App is available
        env:
          ENABLED: ${{ vars.AVUNU_CI_APP_ID != '' && secrets.AVUNU_CI_PRIVATE_KEY != '' }}
        run: echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

      - if: steps.pr.outputs.head != '' && steps.app.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AVUNU_CI_APP_ID }}
          private-key: ${{ secrets.AVUNU_CI_PRIVATE_KEY }}
          permission-contents: write

      - if: steps.pr.outputs.head != ''
        name: Commit and push to the release PR branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          HEAD_REF: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "the fixture is already rendered for $(cat version.txt)"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "test: render the standards fixtures for v$(cat version.txt)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$HEAD_REF"

  # Only without the App: the App's release PR starts its own CI.
  dispatch-ci:
    needs: [release-please, fixture]
    if: always() && needs.release-please.result == 'success' && needs.release-please.outputs.app != 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 10
    permissions:
      contents: read # the checkout
      actions: write # gh workflow run
      checks: read # which checks already ran on the release PR head
      pull-requests: read # the open release PR
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          tool-dir: ${{ runner.temp }}/uv-tool-dir
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin-dir

      - name: Install frappe-nix-tools from this checkout
        run: uv tool install --python 3.14 ./py/frappe_nix_tools

      - name: Run check.yml and pr-policy.yml on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          frappe-nix ci dispatch-ci --repo "$REPO" --integration main --package frappe-nix \
            --context lint=check.yml --context pr-policy=pr-policy.yml \
            --context "build / Check=docs.yml"

  fast-forward:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # move `release` without the App (the ruleset's bypass actor is GitHub Actions)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
          enable-cache: "false"

      # This job can hold the App's key, so nothing it installs is resolved at run time:
      # frappe-nix-tools from this checkout, every dependency from its
      # py/frappe_nix_tools/uv.lock by hash and as a wheel, and only frappe-nix-tools itself
      # built, against a hashed flit_core. uv is pinned above, without its cache, and reads no
      # configuration. Before the App's token is minted.
      - name: Install frappe-nix-tools, hash-locked, from this checkout
        env:
          FLIT_CORE: flit-core==3.12.0 --hash=sha256:e7a0304069ea895172e3c7bb703292e992c5d1555dd1233ab7b5621b5b69e62c
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/frappe-nix-tools"
          mkdir -p "$tools/bin"
          project="$GITHUB_WORKSPACE/py/frappe_nix_tools"
          uv --no-config export -q --frozen --no-dev --no-emit-project --no-header --project "$project" \
            -o "$tools/requirements.txt"
          echo "$FLIT_CORE" > "$tools/build.txt"
          uv --no-config venv -q --python 3.14 --no-project "$tools/venv"
          uv --no-config pip install -q --python "$tools/venv/bin/python" --require-hashes --no-build \
            -r "$tools/requirements.txt" -r "$tools/build.txt"
          uv --no-config pip install -q --python "$tools/venv/bin/python" --offline --no-deps --no-build-isolation "$project"
          ln -s "$tools/venv/bin/frappe-nix" "$tools/bin/frappe-nix"
          echo "$tools/bin" >> "$GITHUB_PATH"

      # GitHub refuses a ref update from GITHUB_TOKEN onto commits that change .github/workflows/
      # (most releases: Dependabot action bumps, frappe-init --sync), so with the GitHub App the
      # move uses its token, which can (Workflows write). Minted after the tools are installed.
      - id: app
        name: Whether the org's GitHub App is available
        env:
          ENABLED: ${{ vars.AVUNU_CI_APP_ID != '' && secrets.AVUNU_CI_PRIVATE_KEY != '' }}
        run: echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

      # An App without Workflows write can't mint this token: fall back to GITHUB_TOKEN, which
      # moves the branch whenever the release changes no workflow file.
      - if: steps.app.outputs.enabled == 'true'
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AVUNU_CI_APP_ID }}
          private-key: ${{ secrets.AVUNU_CI_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Fast-forward release to the new tag, and check it
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.release-please.outputs.sha }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release-please's tag ${TAG@Q} is not vX.Y.Z"
            exit 1
          fi
          frappe-nix ci fast-forward --repo "$REPO" --release-branch release \
            --sha "$SHA" --tag "$TAG" --version-scheme semver --tag-prefix v
