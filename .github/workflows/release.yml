name: release

# frappe-nix's own releases (docs/app-standards/versioning.md, spec §6.2, §6.3, S6, S13), with
# no App:
#
#   release-please  opens or updates the release PR on main with GITHUB_TOKEN, and on its merge
#                   tags vX.Y.Z (version.txt and both frappe-nix-tools version locations move
#                   together, release-please-config.json);
#   fixture         the release PR moves frappe-nix-tools' version, which the caller workflows
#                   of tests/fixtures/standards-app record (`@<sha> # v<version>`), so it
#                   re-renders the fixture offline with the PR's own tools and pushes the
#                   result to the PR branch: every commit on main, the release's included,
#                   keeps a fixture that `frappe-nix sync --check` passes;
#   dispatch-ci     a GITHUB_TOKEN push raises no event, so it dispatches check.yml (without
#                   inputs: `lint` and `flake`, no VM tests), pr-policy.yml and docs.yml (the
#                   main ruleset's required `build / Check`) on the release PR, each only
#                   while its check is absent on the PR's head;
#   fast-forward    moves release-<major> (release-1 for v1.* tags, release-2 for v2.*) to the
#                   new tag by a REST PATCH with force=false, or creates it on a major's first
#                   release, which leaves the previous major's branch at its last release, and
#                   fails unless it then equals the tag. The release-* ruleset
#                   (repo-policy/self/rulesets/release.json) lets only GitHub Actions move it.
#
# The daily cron catches merges that raise no push (an auto-merge enabled with GITHUB_TOKEN)
# and retries a dispatch that failed or a concurrency group cancelled. frappe-nix's flake.lock
# has no frappe-nix node, so the tools come from this checkout.

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 10
    permissions:
      contents: write # tags and releases
      pull-requests: write # the release PR
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      sha: ${{ steps.rp.outputs.sha }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - id: rp
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - if: steps.rp.outcome == 'failure'
        run: |
          echo "::error::release-please failed. If the log says GitHub Actions is not permitted to create pull requests, allow it under Settings > Actions > General > Workflow permissions (repo-policy/self/repo-settings.json sets can_approve_pull_request_reviews)."
          exit 1

  fixture:
    needs: release-please
    if: needs.release-please.result == 'success'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 10
    permissions:
      contents: write # push the re-rendered fixture to the release PR branch
      pull-requests: read # the open release PR
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - name: Find the open release PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          head="$(gh pr list --repo "$REPO" --base main --state open --label 'autorelease: pending' \
            --json headRefName --jq '.[0].headRefName // ""')"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - if: steps.pr.outputs.head != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head }}
          persist-credentials: false

      - if: steps.pr.outputs.head != ''
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          tool-dir: ${{ runner.temp }}/uv-tool-dir
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin-dir

      - if: steps.pr.outputs.head != ''
        name: Re-render the fixture with the release PR's frappe-nix-tools
        run: |
          set -euo pipefail
          uv tool install --python 3.14 ./py/frappe_nix_tools
          app="$RUNNER_TEMP/app"
          cp -r tests/fixtures/standards-app "$app"
          git -C "$app" init -q
          git -C "$app" add -A
          git -C "$app" -c user.name=ci -c user.email=ci@example.com commit -qm fixture
          (cd "$app" && frappe-nix sync --write --offline)
          # A major's first release moves flake.nix's frappe-nix input to release-<major>, and
          # offline the sync cannot relock: point the fixture lock's original at that branch
          # (its locked rev is a fixed old commit either way).
          major="$(cut -d. -f1 version.txt)"
          lock="$app/flake.lock"
          jq --indent 2 --arg ref "release-$major" '.nodes["frappe-nix"].original.ref = $ref' "$lock" > "$lock.new"
          mv "$lock.new" "$lock"
          (cd "$app" && git add -A && frappe-nix sync --check)
          git -C "$app" diff --cached --binary > "$RUNNER_TEMP/fixture.patch"
          if [ -s "$RUNNER_TEMP/fixture.patch" ]; then
            git apply --index --directory=tests/fixtures/standards-app "$RUNNER_TEMP/fixture.patch"
            git diff --cached --stat
          fi

      - if: steps.pr.outputs.head != ''
        name: Commit and push to the release PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "the fixture is already rendered for $(cat version.txt)"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "test: render the standards fixture for v$(cat version.txt)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$HEAD_REF"

  dispatch-ci:
    needs: [release-please, fixture]
    if: always() && needs.release-please.result == 'success'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 10
    permissions:
      contents: read # the checkout
      actions: write # gh workflow run
      checks: read # which checks already ran on the release PR head
      pull-requests: read # the open release PR
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          tool-dir: ${{ runner.temp }}/uv-tool-dir
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin-dir

      - name: Install frappe-nix-tools from this checkout
        run: uv tool install --python 3.14 ./py/frappe_nix_tools

      - name: Run check.yml and pr-policy.yml on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          frappe-nix ci dispatch-ci --repo "$REPO" --integration main --package frappe-nix \
            --context lint=check.yml --context pr-policy=pr-policy.yml \
            --context "build / Check=docs.yml"

  fast-forward:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 10
    permissions:
      contents: write # move release-<major> (the ruleset's bypass actor is GitHub Actions)
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          tool-dir: ${{ runner.temp }}/uv-tool-dir
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin-dir

      - name: Install frappe-nix-tools from this checkout
        run: uv tool install --python 3.14 ./py/frappe_nix_tools

      - name: Fast-forward release-<major> to the new tag, and check it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.release-please.outputs.sha }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          major="${TAG#v}"
          major="${major%%.*}"
          if ! [[ "$major" =~ ^[0-9]+$ ]]; then
            echo "::error::release-please's tag ${TAG@Q} is not vX.Y.Z"
            exit 1
          fi
          frappe-nix ci fast-forward --repo "$REPO" --release-branch "release-$major" \
            --sha "$SHA" --tag "$TAG" --version-scheme semver --tag-prefix v
