name: check

# CI gate for this repo. Auto-merge (Dependabot PRs, and the weekly flake.lock PR) is
# only as safe as what runs here, so these are what you mark required on `main`.
#
# The `lint` job is every hook in .pre-commit-config.yaml over the whole tree, run by prek:
# the command a developer's commit runs, with no nix involved.
#
# The `flake` job is the always-on nix gate: it evaluates every flake output on
# x86_64-linux, which is what actually breaks when nixpkgs or uv2nix move under us
# (renamed attrs, changed function signatures, dropped packages), then builds every
# check that is not a NixOS VM test. The list is read from the flake, not written
# here: a check that is not built does not count as coverage, and a hand-kept list
# is how six of them once went unbuilt. A new check is on the PR path the moment
# it is in `checks`.
#
# The `vm-tests` job builds the NixOS VM tests, one matrix entry each, on every
# pull request and push. Which checks those are is also read from the flake (a
# runNixOSTest result carries a `driver`), and the `flake` job hands the list
# over. None of them builds Frappe: each stubs the bench and tests what the
# NixOS module generates, so a VM test is a NixOS closure from cache.nixos.org
# and a few minutes of KVM, which hosted runners have. A `workflow_dispatch`
# runs them only with `vm-tests: true`: the release flow (release.yml) dispatches
# this workflow on its release PR without inputs, and gets `lint` and `flake` alone.
#
# Every job that uses nix sets up magic-nix-cache on a GitHub-hosted runner, so a run reuses what
# earlier runs built; the self-hosted runner keeps its own /nix/store between jobs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      vm-tests:
        description: Also build the NixOS VM tests
        type: boolean
        default: false

permissions: {}

jobs:
  lint:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    permissions:
      contents: read # the checkout
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP, and its own cleanup leaves what an earlier
      # job made read-only (copies out of the Nix store): clear it, keeping the runner's _* files.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `prek run --all-files --show-diff-on-failure`: a hook that rewrites a file fails the
      # job, so what merges is what the hooks would have left.
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1

  flake:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    permissions:
      contents: read # the checkout
    outputs:
      vm-tests: ${{ steps.split.outputs.vm-tests }}
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP, and its own cleanup leaves what an earlier
      # job made read-only (copies out of the Nix store): clear it, keeping the runner's _* files.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        if: runner.environment == 'github-hosted'
        with:
          diagnostic-endpoint: ""
          use-flakehub: false

      # Evaluating the dev shell makes devenv fetch its own pinned nixpkgs and rust-overlay
      # (fetchFromGitHub, then `import`): import-from-derivation, which `nix flake check
      # --no-build` cannot build and fails on with "path ... is not valid". `nix eval` can, so
      # realise those sources first and the evaluation below finds them in the store.
      - name: Fetch what the dev shell imports from derivation
        run: nix eval --raw .#devShells.x86_64-linux.default.drvPath

      # Evaluates checks/packages/apps/devShells and the NixOS module without building
      # the VM tests. Catches the overwhelming majority of flake.lock breakage.
      - name: Evaluate all flake outputs
        run: nix flake check --no-build --show-trace

      # The scaffolder is small enough to build outright, so the gate is not eval-only.
      # This is also where shellcheck runs over lib/sh/*.
      - name: Build the bench scaffolder
        run: nix build .#default --show-trace

      # checks.x86_64-linux, split in two: the NixOS VM tests (a runNixOSTest result
      # has a `driver`) go to the `vm-tests` job, everything else is built below.
      - name: List the checks
        id: split
        run: |
          # The ${n} is Nix's, not the shell's.
          # shellcheck disable=SC2016
          nix eval --json .#checks.x86_64-linux \
            --apply 'cs: builtins.partition (n: cs.${n} ? driver) (builtins.attrNames cs)' \
            > "$RUNNER_TEMP/checks.json"
          echo "vm-tests=$(jq -c .right "$RUNNER_TEMP/checks.json")" >> "$GITHUB_OUTPUT"
          jq -r '.wrong[]' "$RUNNER_TEMP/checks.json" > "$RUNNER_TEMP/offline-checks"
          echo "VM tests: $(jq -c .right "$RUNNER_TEMP/checks.json")"
          echo "Offline checks: $(wc -l < "$RUNNER_TEMP/offline-checks")"

      # Every check that is not a VM test: the devguard, journald, unixsock and other
      # graft unit tests, frappe-nix.secrets at evaluation, the scripts driven over
      # fixtures and stubs, the NixOS module's units at evaluation, nixfmt, statix
      # and deadnix, the shared repository config, ty, the upstream-config drift
      # check, and every app standards check. All offline and no KVM. `--keep-going` so one failure
      # does not hide the others.
      - name: Build the offline checks
        run: |
          sed 's|^|.#checks.x86_64-linux.|' "$RUNNER_TEMP/offline-checks" \
            | xargs nix build -L --show-trace --keep-going --no-link

  vm-tests:
    needs: flake
    if: github.event_name != 'workflow_dispatch' || inputs.vm-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # the checkout
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.flake.outputs.vm-tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `kvm` stays at its default (on): the installer adds the udev rule so the
      # daemon advertises the `kvm` system feature the VM tests need.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        if: runner.environment == 'github-hosted'
        with:
          diagnostic-endpoint: ""
          use-flakehub: false

      - name: Run the ${{ matrix.test }} NixOS test
        env:
          TEST: ${{ matrix.test }}
        run: nix build ".#checks.x86_64-linux.$TEST" -L --show-trace
