name: app-test

# The `test` gate (docs/app-standards/ci.md, spec §4.2), reusable: the caller job is
# named `ci`, so the check reads `ci / test`. One Nix dev-shell entry runs
# `frappe-test --ci`, which turns on exactly the stages whose modules are on (§5.1).

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      app-root:
        type: string
        default: "."
      integration-branch:
        type: string
        default: develop
      nix-cache:
        description: '"", "cachix:<name>" or "attic:<endpoint>/<cache>"'
        type: string
        default: ""
      test-timeout-minutes:
        type: number
        default: 75
      frappe-nix-override:
        description: frappe-nix's self-test only (a path in the workspace)
        type: string
        default: ""
      runs-on:
        description: >-
          The runner of every Linux job, as JSON: a label or a list of labels
          (`["self-hosted", "nixos"]`). A pull request from a fork always runs on ubuntu-latest.
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      NIX_CACHE_TOKEN:
        description: write; used only on pushes and schedules of the integration branch
        required: false
      NIX_CACHE_READ_TOKEN:
        required: false
      FETCH_TOKEN:
        required: false
    outputs:
      coverage:
        description: the total coverage percent, empty when the tests module is off
        value: ${{ jobs.test.outputs.coverage }}

permissions: {}

env:
  FORCE_COLOR: "1"

jobs:
  test:
    name: test
    if: ${{ !startsWith(github.ref, 'refs/heads/version-') }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.test-timeout-minutes }}
    permissions:
      contents: read # the checkout
      pull-requests: read # the dispatch guard looks up the open PR
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.app-root }}
    outputs:
      coverage: ${{ steps.report.outputs.coverage }}
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP, and its own cleanup leaves what an earlier
      # job made read-only (copies out of the Nix store): clear it, keeping the runner's _* files.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +

      - name: Dispatch guard (a dispatched run must be on the PR head)
        if: github.event_name == 'workflow_dispatch'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head="$(gh pr list --repo "$REPO" --head "$REF_NAME" --state open --json headRefOid --jq '.[0].headRefOid // ""')"
          if [ -n "$head" ] && [ "$head" != "$SHA" ]; then
            echo "::error::stale dispatch: $REF_NAME is at $head, this run is for $SHA"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false

      # The binary cache (spec S15): none, cachix:<name> or attic:<endpoint>/<cache>. Only a
      # push or schedule on the integration branch ever sees the write token.
      - id: cache
        name: Binary cache and private sources
        env:
          CACHE: ${{ inputs.nix-cache }}
          OVERRIDE: ${{ inputs.frappe-nix-override }}
          FETCH_TOKEN: ${{ secrets.FETCH_TOKEN }}
        run: |
          set -euo pipefail
          case "$CACHE" in
            "") echo "kind=none" >> "$GITHUB_OUTPUT" ;;
            cachix:*) echo "kind=cachix" >> "$GITHUB_OUTPUT"; echo "name=${CACHE#cachix:}" >> "$GITHUB_OUTPUT" ;;
            attic:*/*)
              rest="${CACHE#attic:}"
              echo "kind=attic" >> "$GITHUB_OUTPUT"
              echo "endpoint=${rest%/*}" >> "$GITHUB_OUTPUT"
              echo "name=${rest##*/}" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::nix-cache must be empty, cachix:<name> or attic:<endpoint>/<cache>, not $CACHE"; exit 1 ;;
          esac
          if [ -n "$CACHE" ] && [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
            # A self-hosted runner's home outlives the job: the cache's credentials stay in the job's temp dir.
            mkdir -p "$RUNNER_TEMP/config"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/config" >> "$GITHUB_ENV"
          fi
          if [ -n "$FETCH_TOKEN" ]; then
            echo "NIX_CONFIG=access-tokens = github.com=$FETCH_TOKEN" >> "$GITHUB_ENV"
            echo "FRAPPE_NIX_FETCH_TOKEN=$FETCH_TOKEN" >> "$GITHUB_ENV"
          fi
          if [ -n "$OVERRIDE" ]; then
            # frappe-nix's self-test: every nix call uses this checkout of frappe-nix.
            echo "NIX_OVERRIDE=--override-input frappe-nix path:$GITHUB_WORKSPACE/$OVERRIDE" >> "$GITHUB_ENV"
          else
            echo "NIX_OVERRIDE=" >> "$GITHUB_ENV"
          fi

      - if: steps.cache.outputs.kind == 'cachix'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ steps.cache.outputs.name }}
          authToken: ${{ (github.ref == format('refs/heads/{0}', inputs.integration-branch) && (github.event_name == 'push' || github.event_name == 'schedule')) && secrets.NIX_CACHE_TOKEN || secrets.NIX_CACHE_READ_TOKEN }}
          skipPush: ${{ !(github.ref == format('refs/heads/{0}', inputs.integration-branch) && (github.event_name == 'push' || github.event_name == 'schedule')) }}

      - if: steps.cache.outputs.kind == 'attic'
        name: attic
        env:
          TOKEN: ${{ (github.ref == format('refs/heads/{0}', inputs.integration-branch) && (github.event_name == 'push' || github.event_name == 'schedule')) && secrets.NIX_CACHE_TOKEN || secrets.NIX_CACHE_READ_TOKEN }}
          ENDPOINT: ${{ steps.cache.outputs.endpoint }}
          NAME: ${{ steps.cache.outputs.name }}
        run: |
          set -euo pipefail
          # Not `nix profile install`: a self-hosted runner's profile outlives the job.
          attic="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#attic-client^out)/bin"
          echo "$attic" >> "$GITHUB_PATH"
          PATH="$attic:$PATH"
          attic login ci "$ENDPOINT" ${TOKEN:+"$TOKEN"}
          attic use "ci:$NAME"

      # frappe-nix's self-test only: its fixture app lives in a subdirectory of frappe-nix, and
      # commits no nix/uv.lock (it would pin every Python dependency of frappe in frappe-nix's
      # tree). The run makes the fixture a repository of its own, so its flake is that
      # directory, and relocks it.
      - if: inputs.frappe-nix-override != ''
        name: Prepare the self-test's fixture
        env:
          APP_ROOT: ${{ inputs.app-root }}
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          commit() { git add -A && git -c user.name=self-test -c user.email=self-test@localhost commit -qm "$1"; }
          if [ "$APP_ROOT" != . ] && [ ! -e .git ]; then
            git init -q
            # coverage matches omit patterns against absolute paths, and this app sits under
            # frappe-nix's tests/: narrow the tests omit to the app's own tests/.
            sed -i "s#\"\*/tests/\*\"#\"*/${APP}/tests/*\"#" pyproject.toml
            commit "the fixture app"
          fi
          if [ ! -f nix/uv.lock ]; then
            read -ra override <<< "$NIX_OVERRIDE"
            nix run --no-pure-eval "${override[@]}" .#relock
            # frappe's own ui/yarn.lock at the fixture's frappe pin does not cover its package.json;
            # force a repaired lock over it, as the build's own message says.
            nix run --no-pure-eval "${override[@]}" .#relock -- --node-locks frappe/ui
            commit "relock"
          fi

      # The clean bench build (also every app's assets, S30): always on push, schedule and
      # dispatch; on a pull request only when the diff touches a build input.
      - name: Clean bench build
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          build=true
          if [ "$EVENT" = pull_request ]; then
            build=false
            base="$(git merge-base "$BASE_SHA" HEAD)"
            inputs='^(package\.json|yarn\.lock|flake\.nix|flake\.lock|nix/|scripts/vite-register\.mjs|'"$APP"'/public/|'"$APP"'/hooks\.py$)|(^|/)(package\.json|yarn\.lock|vite[^/]*\.config\.[^/]+)$'
            if git diff --name-only --relative "$base" HEAD | grep -Eq "$inputs"; then
              build=true
            fi
          fi
          if [ "$build" = true ]; then
            read -ra override <<< "$NIX_OVERRIDE"
            nix build .#default -L --no-pure-eval "${override[@]}"
          else
            echo "No build input changed; the bench build runs on the integration branch."
          fi

      - name: frappe-test --ci
        env:
          FRAPPE_NIX_CI: "1"
        run: |
          set -euo pipefail
          read -ra override <<< "$NIX_OVERRIDE"
          mkdir -p .dev-dist
          nix develop --no-pure-eval "${override[@]}" --profile .dev-dist/devshell-profile -c frappe-test --ci

      - if: failure()
        name: Bench logs
        run: |
          set -euo pipefail
          for f in .frappe-nix/bench/logs/*.log; do
            if [ -f "$f" ]; then
              echo "::group::$f"
              tail -n 200 "$f"
              echo "::endgroup::"
            fi
          done

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: ${{ inputs.app-root }}/.dev-dist/test/
          if-no-files-found: ignore

      - if: success() && steps.cache.outputs.kind == 'attic' && github.ref == format('refs/heads/{0}', inputs.integration-branch) && (github.event_name == 'push' || github.event_name == 'schedule')
        name: Push to the attic cache
        env:
          TOKEN: ${{ secrets.NIX_CACHE_TOKEN }}
          ENDPOINT: ${{ steps.cache.outputs.endpoint }}
          NAME: ${{ steps.cache.outputs.name }}
        run: |
          set -euo pipefail
          attic login ci "$ENDPOINT" "$TOKEN"
          paths=()
          for p in ./result .dev-dist/devshell-profile; do
            if [ -e "$p" ]; then
              paths+=("$p")
            fi
          done
          if [ "${#paths[@]}" -gt 0 ]; then
            attic push "ci:$NAME" "${paths[@]}"
          fi

      - id: report
        if: always()
        name: Coverage
        run: |
          set -euo pipefail
          report=.dev-dist/test/frappe-test-report.json
          coverage=""
          if [ -f "$report" ]; then
            coverage="$(jq -r '.coverage.percent // empty' "$report")"
          fi
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"

  # The report on the pull request: one comment per app, edited on every run, holding
  # frappe-test's summary.md (the verdict, the stages, the failed tests, the coverage).
  # Its own job, so `test`, which runs the pull request's code, never holds a token that
  # can write. A fork's pull request gets a read-only token, so no comment; a dispatched
  # run finds its pull request by branch. Not a gate: `ci / test-report` is never required.
  test-report:
    name: test-report
    needs: test
    if: >-
      !cancelled() && needs.test.result != 'skipped' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      pull-requests: write # the comment
    steps:
      # A self-hosted runner can keep an earlier job's temp files.
      - name: A clean directory for the report
        run: rm -rf "$RUNNER_TEMP/test-report"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # a run that died early uploaded nothing
        with:
          name: test-report
          path: ${{ runner.temp }}/test-report

      - name: The comment
        env:
          APP: ${{ inputs.app }}
          RESULT: ${{ needs.test.result }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/test-report/summary.md"
          {
            if [ -f "$summary" ]; then
              cat "$summary"
            elif [ "$RESULT" = success ]; then
              echo "## frappe-test: $APP"
              echo
              echo "**passed**, and wrote no report."
            else
              echo "## frappe-test: $APP"
              echo
              echo "**$RESULT before frappe-test wrote its report**: the bench, the build or the dev shell did not come up. The job log has the bench logs."
            fi
            echo
            echo "_${SHA:0:7}, from [this run]($RUN_URL)._"
          } > "$RUNNER_TEMP/test-report/comment.md"

      - uses: Avunu/python-devops-nix/.github/actions/sticky-comment@65cb6eafb7ffe79bce77e91782674ae02b2bd72b # python-devops-nix#26 (no release yet)
        with:
          marker: frappe-test-${{ inputs.app }}
          body-file: ${{ runner.temp }}/test-report/comment.md
