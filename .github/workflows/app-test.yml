name: app-test

# The `test` gate (docs/app-standards/ci.md, spec §4.2), reusable: the caller job is
# named `ci`, so the check reads `ci / test`. One Nix dev-shell entry runs
# `frappe-test --ci`, which turns on exactly the stages whose modules are on (§5.1).

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      app-root:
        type: string
        default: "."
      integration-branch:
        type: string
        default: develop
      nix-cache:
        description: '"", "cachix:<name>" or "attic:<endpoint>/<cache>"'
        type: string
        default: ""
      test-timeout-minutes:
        type: number
        default: 75
      frappe-nix-override:
        description: frappe-nix's self-test only (a path in the workspace)
        type: string
        default: ""
    secrets:
      NIX_CACHE_TOKEN:
        description: write; used only on pushes and schedules of the integration branch
        required: false
      NIX_CACHE_READ_TOKEN:
        required: false
      FETCH_TOKEN:
        required: false
    outputs:
      coverage:
        description: the total coverage percent, empty when the tests module is off
        value: ${{ jobs.test.outputs.coverage }}

permissions: {}

env:
  FORCE_COLOR: "1"

jobs:
  test:
    name: test
    if: ${{ !startsWith(github.ref, 'refs/heads/version-') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.test-timeout-minutes }}
    permissions:
      contents: read # the checkout
      pull-requests: read # the dispatch guard looks up the open PR
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.app-root }}
    outputs:
      coverage: ${{ steps.report.outputs.coverage }}
    steps:
      - name: Dispatch guard (a dispatched run must be on the PR head)
        if: github.event_name == 'workflow_dispatch'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head="$(gh pr list --repo "$REPO" --head "$REF_NAME" --state open --json headRefOid --jq '.[0].headRefOid // ""')"
          if [ -n "$head" ] && [ "$head" != "$SHA" ]; then
            echo "::error::stale dispatch: $REF_NAME is at $head, this run is for $SHA"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      # The binary cache (spec S15): none, cachix:<name> or attic:<endpoint>/<cache>. Only a
      # push or schedule on the integration branch ever sees the write token.
      - id: cache
        name: Binary cache and private sources
        env:
          CACHE: ${{ inputs.nix-cache }}
          OVERRIDE: ${{ inputs.frappe-nix-override }}
          FETCH_TOKEN: ${{ secrets.FETCH_TOKEN }}
        run: |
          set -euo pipefail
          case "$CACHE" in
            "") echo "kind=none" >> "$GITHUB_OUTPUT" ;;
            cachix:*) echo "kind=cachix" >> "$GITHUB_OUTPUT"; echo "name=${CACHE#cachix:}" >> "$GITHUB_OUTPUT" ;;
            attic:*/*)
              rest="${CACHE#attic:}"
              echo "kind=attic" >> "$GITHUB_OUTPUT"
              echo "endpoint=${rest%/*}" >> "$GITHUB_OUTPUT"
              echo "name=${rest##*/}" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::nix-cache must be empty, cachix:<name> or attic:<endpoint>/<cache>, not $CACHE"; exit 1 ;;
          esac
          if [ -n "$FETCH_TOKEN" ]; then
            echo "access-tokens = github.com=$FETCH_TOKEN" | sudo tee -a /etc/nix/nix.conf > /dev/null
            echo "FRAPPE_NIX_FETCH_TOKEN=$FETCH_TOKEN" >> "$GITHUB_ENV"
          fi
          if [ -n "$OVERRIDE" ]; then
            # frappe-nix's self-test: every nix call uses this checkout of frappe-nix.
            echo "NIX_OVERRIDE=--override-input frappe-nix path:$GITHUB_WORKSPACE/$OVERRIDE" >> "$GITHUB_ENV"
          else
            echo "NIX_OVERRIDE=" >> "$GITHUB_ENV"
          fi

      - if: steps.cache.outputs.kind == 'cachix'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ steps.cache.outputs.name }}
          authToken: ${{ (github.ref == format('refs/heads/{0}', inputs.integration-branch) && (github.event_name == 'push' || github.event_name == 'schedule')) && secrets.NIX_CACHE_TOKEN || secrets.NIX_CACHE_READ_TOKEN }}
          skipPush: ${{ !(github.ref == format('refs/heads/{0}', inputs.integration-branch) && (github.event_name == 'push' || github.event_name == 'schedule')) }}

      - if: steps.cache.outputs.kind == 'attic'
        name: attic
        env:
          TOKEN: ${{ (github.ref == format('refs/heads/{0}', inputs.integration-branch) && (github.event_name == 'push' || github.event_name == 'schedule')) && secrets.NIX_CACHE_TOKEN || secrets.NIX_CACHE_READ_TOKEN }}
          ENDPOINT: ${{ steps.cache.outputs.endpoint }}
          NAME: ${{ steps.cache.outputs.name }}
        run: |
          set -euo pipefail
          nix profile install --inputs-from . nixpkgs#attic-client
          attic login ci "$ENDPOINT" ${TOKEN:+"$TOKEN"}
          attic use "ci:$NAME"

      # The clean bench build (also every app's assets, S30): always on push, schedule and
      # dispatch; on a pull request only when the diff touches a build input.
      - name: Clean bench build
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          build=true
          if [ "$EVENT" = pull_request ]; then
            build=false
            base="$(git merge-base "$BASE_SHA" HEAD)"
            inputs='^(package\.json|yarn\.lock|flake\.nix|flake\.lock|nix/|scripts/vite-register\.mjs|'"$APP"'/public/|'"$APP"'/hooks\.py$)|(^|/)(package\.json|yarn\.lock|vite[^/]*\.config\.[^/]+)$'
            if git diff --name-only --relative "$base" HEAD | grep -Eq "$inputs"; then
              build=true
            fi
          fi
          if [ "$build" = true ]; then
            read -ra override <<< "$NIX_OVERRIDE"
            nix build .#default -L --no-pure-eval "${override[@]}"
          else
            echo "No build input changed; the bench build runs on the integration branch."
          fi

      - name: frappe-test --ci
        env:
          FRAPPE_NIX_CI: "1"
        run: |
          set -euo pipefail
          read -ra override <<< "$NIX_OVERRIDE"
          nix develop --no-pure-eval "${override[@]}" --profile .dev-dist/devshell-profile -c frappe-test --ci

      - if: failure()
        name: Bench logs
        run: |
          set -euo pipefail
          for f in .frappe-nix/bench/logs/*.log; do
            if [ -f "$f" ]; then
              echo "::group::$f"
              tail -n 200 "$f"
              echo "::endgroup::"
            fi
          done

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: ${{ inputs.app-root }}/.dev-dist/test/
          if-no-files-found: ignore

      - if: success() && steps.cache.outputs.kind == 'attic' && github.ref == format('refs/heads/{0}', inputs.integration-branch) && (github.event_name == 'push' || github.event_name == 'schedule')
        name: Push to the attic cache
        env:
          TOKEN: ${{ secrets.NIX_CACHE_TOKEN }}
          ENDPOINT: ${{ steps.cache.outputs.endpoint }}
          NAME: ${{ steps.cache.outputs.name }}
        run: |
          set -euo pipefail
          attic login ci "$ENDPOINT" "$TOKEN"
          paths=()
          for p in ./result .dev-dist/devshell-profile; do
            if [ -e "$p" ]; then
              paths+=("$p")
            fi
          done
          if [ "${#paths[@]}" -gt 0 ]; then
            attic push "ci:$NAME" "${paths[@]}"
          fi

      - id: report
        if: always()
        name: Coverage
        run: |
          set -euo pipefail
          report=.dev-dist/test/frappe-test-report.json
          coverage=""
          if [ -f "$report" ]; then
            coverage="$(jq -r '.coverage.percent // empty' "$report")"
          fi
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"
