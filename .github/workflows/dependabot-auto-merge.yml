name: Dependabot auto-merge

# Dependabot pull requests, through python-devops-nix's reusable workflow (its
# CONVENTIONS.md, CI) with its default policy: every update type auto-merges, and
# github-actions bumps, which change what CI runs, are reviewed by a person. GitHub
# merges once the branch is mergeable and every *required* status check passes, so
# auto-merge is only as safe as the checks marked required on `main`. Dependabot's
# github-actions entry moves the pin below.
#
# Requires (one-time, in repo settings):
#   • Settings → General → Pull Requests → "Allow auto-merge"
#   • Settings → Branches → protect `main`, require the "flake" status check
on: pull_request

permissions: {}

jobs:
  auto-merge:
    # The PR's author, not github.actor (which a re-run by a person changes).
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write # gh pr merge --auto
      pull-requests: write # gh pr merge --auto
    uses: Avunu/python-devops-nix/.github/workflows/dependabot-auto-merge.yml@28418614a8f4479c11ac755aa4f402c0a9aa6192 # main (no release yet)
