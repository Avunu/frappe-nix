name: Dependabot auto-merge

# frappe-nix's own Dependabot pull requests (docs/app-standards/spec.md §4.10), through
# python-devops-nix's reusable workflows (its docs/conventions.md, CI), with github_actions
# excluded and the key jobs' actions under review-dependencies. Dependabot's github-actions
# entry moves the pins below, and a PR that does is held.
#
#   auto-merge       every nix, uv and pre-commit one, whatever its update type, gets
#                    auto-merge (squash) at the head it was decided on: GitHub merges it once
#                    every check the main ruleset requires passes, and one that fails stays
#                    open. The required checks are the gate, so auto-merge is only as safe as
#                    they are. One the reusable workflow holds (a diff that touches a workflow
#                    or an action, below) has auto-merge turned off there.
#   hold             every other one, github-actions bumps above all, is labelled needs-review
#                    and never auto-merged. An action or reusable workflow pin here runs in jobs
#                    that hold the org's GitHub App key: this repository's own release.yml (and
#                    rollout.yml's publish job, with the rollout App's key), and every app's
#                    app-*.yml jobs once a release carries the pin. A compromised
#                    release of one would pass every required check, so a person reviews it.
#                    The ecosystem is read from Dependabot's branch name
#                    (dependabot/<ecosystem>/...), which only Dependabot writes, and a name this
#                    list does not have is held too.
#   update-branches  after each push to main, and daily, every open Dependabot PR that is
#                    behind main is brought up to date through the update-branch API. A PR
#                    that is not behind is left alone.
#
# The org's GitHub App, when the repository can read it (the variable AVUNU_CI_APP_ID, or a
# Dependabot secret of that name, and the secret AVUNU_CI_PRIVATE_KEY), enables the auto-merge
# and updates the branches, so a merge raises a push that starts check.yml and release.yml on
# main, and an updated branch starts its checks. Without it, GITHUB_TOKEN: the merge raises no
# push (release.yml's daily cron catches up), and the workflows main requires are dispatched
# on each updated branch. The key goes only to python-devops-nix at e76d5d8 (#72) or a later
# pin that tests/standards/ci.nix names: there every job of both workflows runs on
# GitHub-hosted ubuntu-latest, the job that mints the token checks nothing out and runs only
# create-github-app-token and gh, and it runs only when two jobs without the key agree
# (`policy`, from fetch-metadata, and `diff`, from the PR's diff read with gh alone). The
# `with:` below makes `diff` hold a PR that changes a workflow or action file, or a reference
# to an action a key job runs, even under an ecosystem the `if:` lets through.
#
# Requires (one-time, in repo settings):
#   • Settings → General → Pull Requests → "Allow auto-merge"
#   • Settings → Rules → the main ruleset requires "flake" and "build / Check"
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  auto-merge:
    # The PR's author, not github.actor (which a re-run by a person changes); and an ecosystem
    # whose bumps run in no job that holds the App's key.
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
      && (startsWith(github.head_ref, 'dependabot/nix/') || startsWith(github.head_ref, 'dependabot/uv/')
      || startsWith(github.head_ref, 'dependabot/pre_commit/'))
    permissions:
      contents: write # gh pr merge --auto
      pull-requests: write # gh pr merge --auto
    uses: Avunu/python-devops-nix/.github/workflows/dependabot-auto-merge.yml@e76d5d850b35e4d0abc58fae6617713764f3683a # python-devops-nix main, #72 (no release yet)
    with:
      # Backstops to the `if:` above: a github-actions bump never auto-merges, and a diff that
      # touches a workflow or action file, or a `uses:` of an action or workflow that runs with
      # an App's key (here, in release.yml and rollout.yml, and in every app's app-*.yml), is held.
      exclude-ecosystems: github_actions
      review-dependencies: >-
        actions/create-github-app-token actions/checkout actions/download-artifact
        actions/upload-artifact astral-sh/setup-uv dependabot/fetch-metadata
        googleapis/release-please-action DeterminateSystems/nix-installer-action
        Avunu/python-devops-nix
    # A Dependabot run sees only Dependabot secrets: the App's ID may be one too.
    secrets:
      APP_ID: ${{ vars.AVUNU_CI_APP_ID || secrets.AVUNU_CI_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.AVUNU_CI_PRIVATE_KEY }}

  # Every other Dependabot PR: auto-merge off (an earlier run may have turned it on), and the
  # needs-review label. GITHUB_TOKEN only, and nothing checked out or installed.
  hold:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
      && !(startsWith(github.head_ref, 'dependabot/nix/') || startsWith(github.head_ref, 'dependabot/uv/')
      || startsWith(github.head_ref, 'dependabot/pre_commit/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # gh pr merge --disable-auto
      pull-requests: write # the label, and auto-merge off
    steps:
      - name: Hold for review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if ! gh pr merge --disable-auto "$PR_URL"; then
            on="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')"
            if [ "$on" != false ]; then
              echo "::error::could not turn off auto-merge on $PR_URL"
              exit 1
            fi
          fi
          gh label create needs-review --repo "$GITHUB_REPOSITORY" --color d93f0b \
            --description "Not merged automatically; a person reviews it" --force
          gh pr edit "$PR_URL" --add-label needs-review
          echo "::notice::not auto-merged: this bump moves an action or workflow that can run where the GitHub App's key is, so a person reviews it"

  update-branches:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write # update-branch without the App
      pull-requests: write # update-branch
      actions: write # without the App, dispatch the required checks on the new head
    uses: Avunu/python-devops-nix/.github/workflows/dependabot-update-branches.yml@e76d5d850b35e4d0abc58fae6617713764f3683a # python-devops-nix main, #72 (no release yet)
    with:
      # Without the App: the workflows of the checks main requires ("flake", "build / Check"),
      # and pr-policy.
      dispatch: check.yml docs.yml pr-policy.yml
    secrets:
      APP_ID: ${{ vars.AVUNU_CI_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.AVUNU_CI_PRIVATE_KEY }}
