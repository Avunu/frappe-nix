name: Dependabot auto-merge

# Enables auto-merge on every Dependabot PR. GitHub then merges it once the branch is
# mergeable and all *required* status checks pass — so protect `main` and mark the
# checks you trust as required, otherwise this merges on nothing.
#
# Requires (one-time, in repo settings):
#   • Settings → General → Pull Requests → "Allow auto-merge"
#   • Settings → Branches → protect `main`, require the "flake" status check
on: pull_request

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh pr merge --auto
      pull-requests: write # gh pr merge --auto
    # The PR's author, not github.actor (which a re-run by a person changes).
    if: github.event.pull_request.user.login == 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/github_actions/')
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
