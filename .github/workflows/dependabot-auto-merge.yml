name: Dependabot auto-merge

# frappe-nix's own Dependabot pull requests (docs/app-standards/spec.md §4.10), through
# python-devops-nix's reusable workflows (its docs/conventions.md, CI) with their default
# policy. Dependabot's github-actions entry moves the pins below.
#
#   auto-merge       every one, whatever its ecosystem or update type, github-actions bumps
#                    included, gets auto-merge (squash): GitHub merges it once every check
#                    the main ruleset requires passes, and one that fails stays open. The
#                    required checks are the gate, so auto-merge is only as safe as they are.
#   update-branches  after each push to main, and daily, every open Dependabot PR that is
#                    behind main is brought up to date through the update-branch API. A PR
#                    that is not behind is left alone.
#
# Both use GITHUB_TOKEN, never the org's GitHub App (AVUNU_CI_PRIVATE_KEY): at the pin below,
# python-devops-nix runs these jobs on its shared ["self-hosted","nixos"] runners, where another
# repository's job could read what they leave behind, and the App's key must never be there.
# So the merge raises no push (release.yml's daily cron catches up), and the workflows main
# requires are dispatched on each updated branch. The App comes back (`APP_ID` and
# `APP_PRIVATE_KEY` under `secrets:`) only with pins at or after python-devops-nix#72, which
# moves both jobs to ubuntu-latest; tests/standards/ci.nix refuses the key at any other pin.
#
# Requires (one-time, in repo settings):
#   • Settings → General → Pull Requests → "Allow auto-merge"
#   • Settings → Rules → the main ruleset requires "flake" and "build / Check"
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  auto-merge:
    # The PR's author, not github.actor (which a re-run by a person changes).
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write # gh pr merge --auto
      pull-requests: write # gh pr merge --auto
    uses: Avunu/python-devops-nix/.github/workflows/dependabot-auto-merge.yml@0c9a3a0dd9e45c99299029ae1baa5fdb3a2f6963 # python-devops-nix main, #57 (no release yet)

  update-branches:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write # update-branch without the App
      pull-requests: write # update-branch
      actions: write # without the App, dispatch the required checks on the new head
    uses: Avunu/python-devops-nix/.github/workflows/dependabot-update-branches.yml@0c9a3a0dd9e45c99299029ae1baa5fdb3a2f6963 # python-devops-nix main, #57 (no release yet)
    with:
      # The workflows of the checks main requires ("flake", "build / Check"), and pr-policy.
      dispatch: check.yml docs.yml pr-policy.yml
