name: app-lint

# The `lint` gate (docs/app-standards/ci.md, spec §4.2), reusable: the caller job is
# named `ci`, so the check reads `ci / lint`. Setup only; the steps are
# `frappe-nix gate lint` (S43): the managed-file check, prek, semgrep, the ratchets.

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      app-root:
        type: string
        default: "."
      integration-branch:
        type: string
        default: develop
      frappe-nix-override:
        description: frappe-nix's self-test only (a path in the workspace)
        type: string
        default: ""
      runs-on:
        description: >-
          The runner of every Linux job, as JSON: a label or a list of labels
          (`["self-hosted", "nixos"]`). A pull request from a fork always runs on ubuntu-latest.
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      FETCH_TOKEN:
        required: false

permissions: {}

env:
  FORCE_COLOR: "1"
  # The tools/ project's Python: uv would take its newest, which semgrep 1.179.0 crashes on.
  UV_PYTHON: "3.14"

jobs:
  lint:
    name: lint
    if: ${{ !startsWith(github.ref, 'refs/heads/version-') }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    timeout-minutes: 45
    permissions:
      contents: read # the checkout
      pull-requests: read # the dispatch guard looks up the open PR
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.app-root }}
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - name: Dispatch guard (a dispatched run must be on the PR head)
        if: github.event_name == 'workflow_dispatch'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head="$(gh pr list --repo "$REPO" --head "$REF_NAME" --state open --json headRefOid --jq '.[0].headRefOid // ""')"
          if [ -n "$head" ] && [ "$head" != "$SHA" ]; then
            echo "::error::stale dispatch: $REF_NAME is at $head, this run is for $SHA"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: files
        name: Which shared files are live
        run: |
          set -euo pipefail
          echo "node=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tools=$([ -f tools/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.files.outputs.node == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.app-root }}/package.json

      - if: steps.files.outputs.node == 'true'
        name: Hash yarn.lock for the node_modules cache key
        id: yarn-lock
        # Not hashFiles(): the runner evaluates it with its own externals/node20,
        # which nixpkgs' github-runner does not ship (it has node24 only).
        env:
          APP_ROOT: ${{ inputs.app-root }}
        run: echo "sha256=$(sha256sum "$APP_ROOT/yarn.lock" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - if: steps.files.outputs.node == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.app-root }}/node_modules
          key: node-modules-${{ runner.os }}-${{ steps.yarn-lock.outputs.sha256 }}

      # GitHub-hosted images ship yarn classic; a self-hosted runner may not.
      - if: steps.files.outputs.node == 'true' && runner.environment != 'github-hosted'
        name: yarn classic, when the runner has none
        run: command -v yarn > /dev/null || npm install --global yarn@1.22.22 # zizmor: ignore[adhoc-packages]

      - if: steps.files.outputs.node == 'true'
        run: yarn install --frozen-lockfile --non-interactive

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Saving the cache uploads it to GitHub; from a self-hosted runner that
          # is slow (100+ MB) and outlasts the job, so only hosted runners save it.
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-glob: ${{ inputs.app-root }}/tools/uv.lock
          tool-dir: ${{ runner.temp }}/uv-tool-dir
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin-dir

      - if: steps.files.outputs.tools == 'true'
        run: |
          set -euo pipefail
          uv lock --check --project tools
          uv sync --frozen --project tools

      - name: Install frappe-nix-tools at the frappe-nix revision flake.lock pins
        env:
          OVERRIDE: ${{ inputs.frappe-nix-override }}
          FETCH_TOKEN: ${{ secrets.FETCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$FETCH_TOKEN" ]; then
            echo "FRAPPE_NIX_FETCH_TOKEN=$FETCH_TOKEN" >> "$GITHUB_ENV"
          fi
          if [ -n "$OVERRIDE" ]; then
            uv tool install --python 3.14 "$GITHUB_WORKSPACE/$OVERRIDE/py/frappe_nix_tools"
            echo "FRAPPE_NIX_ALLOW_SKEW=1" >> "$GITHUB_ENV"      # self-test only (spec §3.7)
            echo "FRAPPE_NIX_EXPECT_REV=" >> "$GITHUB_ENV"
          else
            node="$(jq -c '.nodes[.nodes.root.inputs["frappe-nix"]].locked' flake.lock)"
            rev="$(jq -r .rev <<<"$node")"
            src="$(jq -r '"\(.owner)/\(.repo)"' <<<"$node")"   # the frappe-nix repository the app locks, or a fork
            uv tool install --python 3.14 "frappe-nix-tools @ git+https://github.com/${src}@${rev}#subdirectory=py/frappe_nix_tools"
            echo "FRAPPE_NIX_EXPECT_REV=$rev" >> "$GITHUB_ENV"
          fi

      - id: cfg
        run: frappe-nix config --github-output modules

      - name: The ratchet base
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INTEGRATION: ${{ inputs.integration-branch }}
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT" = pull_request ] && [ -n "$BASE_SHA" ]; then
            base="$(git merge-base "$BASE_SHA" HEAD)"
          elif [ "$EVENT" = workflow_dispatch ]; then
            base="$(git merge-base "origin/$INTEGRATION" HEAD)"
          fi
          echo "RATCHET_BASE=$base" >> "$GITHUB_ENV"

      - name: frappe-nix gate lint
        env:
          INTEGRATION: ${{ inputs.integration-branch }}
        run: |
          set -euo pipefail
          args=(--format github)
          if [ -n "$RATCHET_BASE" ]; then
            args+=(--base "$RATCHET_BASE")
          fi
          if [ -n "$FRAPPE_NIX_EXPECT_REV" ]; then
            args+=(--expect-rev "$FRAPPE_NIX_EXPECT_REV")
          fi
          frappe-nix gate lint "${args[@]}"

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: ${{ inputs.app-root }}/.dev-dist/gate/
          if-no-files-found: ignore
