name: app-typecheck

# The `typecheck` gate (docs/app-standards/ci.md, spec §4.2), reusable: the caller job is
# named `ci`, so the check reads `ci / typecheck`. Setup only; the steps are
# `frappe-nix gate typecheck` (S43): tsc, unchecked JS, JS unit tests, doctype types.

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      app-root:
        type: string
        default: "."
      integration-branch:
        type: string
        default: develop
      frappe-nix-override:
        description: frappe-nix's self-test only (a path in the workspace)
        type: string
        default: ""
      runs-on:
        description: >-
          The runner of every Linux job, as JSON: a label or a list of labels
          (`["self-hosted", "nixos"]`). A pull request from a fork always runs on ubuntu-latest.
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      FETCH_TOKEN:
        required: false

permissions: {}

env:
  FORCE_COLOR: "1"
  # The tools/ project's Python: uv would take its newest, which semgrep 1.179.0 crashes on.
  UV_PYTHON: "3.14"

jobs:
  typecheck:
    name: typecheck
    if: ${{ !startsWith(github.ref, 'refs/heads/version-') }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    permissions:
      contents: read # the checkout
      pull-requests: read # the dispatch guard looks up the open PR
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.app-root }}
    steps:
      - name: Dispatch guard (a dispatched run must be on the PR head)
        if: github.event_name == 'workflow_dispatch'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head="$(gh pr list --repo "$REPO" --head "$REF_NAME" --state open --json headRefOid --jq '.[0].headRefOid // ""')"
          if [ -n "$head" ] && [ "$head" != "$SHA" ]; then
            echo "::error::stale dispatch: $REF_NAME is at $head, this run is for $SHA"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.app-root }}/package.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.app-root }}/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles(format('{0}/yarn.lock', inputs.app-root)) }}

      # GitHub-hosted images ship yarn classic; a self-hosted runner may not.
      - if: runner.environment != 'github-hosted'
        name: yarn classic, when the runner has none
        run: command -v yarn > /dev/null || npm install --global yarn@1.22.22 # zizmor: ignore[adhoc-packages]

      - run: yarn install --frozen-lockfile --non-interactive

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          tool-dir: ${{ runner.temp }}/uv-tool-dir
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin-dir

      - name: Install frappe-nix-tools at the frappe-nix revision flake.lock pins
        env:
          OVERRIDE: ${{ inputs.frappe-nix-override }}
          FETCH_TOKEN: ${{ secrets.FETCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$FETCH_TOKEN" ]; then
            echo "FRAPPE_NIX_FETCH_TOKEN=$FETCH_TOKEN" >> "$GITHUB_ENV"
          fi
          if [ -n "$OVERRIDE" ]; then
            uv tool install --python 3.14 "$GITHUB_WORKSPACE/$OVERRIDE/py/frappe_nix_tools"
            echo "FRAPPE_NIX_ALLOW_SKEW=1" >> "$GITHUB_ENV"      # self-test only (spec §3.7)
            echo "FRAPPE_NIX_EXPECT_REV=" >> "$GITHUB_ENV"
          else
            node="$(jq -c '.nodes[.nodes.root.inputs["frappe-nix"]].locked' flake.lock)"
            rev="$(jq -r .rev <<<"$node")"
            src="$(jq -r '"\(.owner)/\(.repo)"' <<<"$node")"   # the frappe-nix repository the app locks, or a fork
            uv tool install --python 3.14 "frappe-nix-tools @ git+https://github.com/${src}@${rev}#subdirectory=py/frappe_nix_tools"
            echo "FRAPPE_NIX_EXPECT_REV=$rev" >> "$GITHUB_ENV"
          fi

      - id: cfg
        run: frappe-nix config --github-output modules

      - id: frappe
        name: The app's locked frappe tree
        run: |
          set -euo pipefail
          path="$(frappe-nix pin-path frappe)"
          echo "FRAPPE_PATH=$path" >> "$GITHUB_ENV"
          echo "rev=$(jq -r '.nodes[.nodes.root.inputs.frappe].locked.rev' flake.lock)" >> "$GITHUB_OUTPUT"
          echo "node-modules=$(frappe-nix config frappe-node-modules)" >> "$GITHUB_OUTPUT"

      - if: steps.cfg.outputs.typescript == 'true' && steps.frappe.outputs.node-modules == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.FRAPPE_PATH }}/node_modules
          key: frappe-node-modules-${{ runner.os }}-${{ steps.frappe.outputs.rev }}

      - name: frappe-nix gate typecheck
        run: frappe-nix gate typecheck --format github

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typecheck-report
          path: ${{ inputs.app-root }}/.dev-dist/gate/
          if-no-files-found: ignore
