version: 2

# Keeps this repo's dependencies up to date. PRs auto-merge once the required checks go
# green — see .github/workflows/dependabot-auto-merge.yml.
#
# Deliberately NOT configured: templates/bench/pyproject.toml. It is a scaffolding
# template, not a resolvable project — not even valid TOML until `frappe-init`
# substitutes the @PLACEHOLDER@ tokens (`override-dependencies = @OVERRIDES@`), so a
# uv/pip updater would only error. The generated bench gets its own uv.lock, which the
# project owner updates with `uv lock`.
updates:
  # Nix flake inputs — nixpkgs, flake-parts, devenv, nix2container, pyproject-nix,
  # uv2nix, pyproject-build-systems, nix-oci. This is the real dependency set for this
  # repo. Dependabot reads flake.lock directly (schema v7).
  #
  # Weekly, not daily: nixpkgs tracks nixos-unstable and moves constantly, so a daily
  # bump would be pure churn.
  #
  # Grouped into one PR on purpose. uv2nix and pyproject-build-systems both `follows`
  # pyproject-nix and nixpkgs; bumping them through separate PRs can land a lock where
  # the followed and following inputs disagree. One PR keeps the graph consistent.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      nix:
        patterns: ["*"]

  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]
